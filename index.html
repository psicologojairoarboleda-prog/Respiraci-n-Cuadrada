<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Respiración Cuadrática - Meditación Guiada</title>
    <style>
        :root {
            --bg-color: #f4f0ea;
            --card-bg: #ffffff;
            --primary-color: #8b7bb0;
            --accent-inhale: #71b280;
            --accent-hold1: #8b7bb0;
            --accent-exhale: #e08a68;
            --accent-hold2: #5c9ead;
            --text-color: #2c2c2c;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 24px;
            padding: 30px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
            color: var(--primary-color);
        }

        p.subtitle {
            font-size: 0.9rem;
            color: #666;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .box-wrapper {
            position: relative;
            width: 220px;
            height: 220px;
            margin: 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .box-bg {
            fill: none;
            stroke: #e6e0d8;
            stroke-width: 8;
        }

        .box-progress {
            fill: none;
            stroke: var(--primary-color);
            stroke-width: 8;
            stroke-linecap: round;
            stroke-dasharray: 800;
            stroke-dashoffset: 800;
            transition: stroke 0.3s ease;
        }

        .breathing-circle {
            width: 100px;
            height: 100px;
            background-color: var(--primary-color);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            font-size: 2.2rem;
            box-shadow: 0 0 20px rgba(0,0,0,0.08);
            transform: scale(1);
            transition: transform 0.1s linear, background-color 0.4s ease;
            z-index: 2;
        }

        .instruction {
            font-size: 1.1rem;
            font-weight: 600;
            min-height: 40px;
            margin: 15px 0 5px 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .timer-info {
            font-size: 0.9rem;
            color: #777;
            margin-bottom: 20px;
        }

        .controls {
            display: flex;
            gap: 10px;
            flex-direction: column;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s ease;
        }

        .audio-toggle {
            background: none;
            border: 1px solid #ccc;
            color: #555;
            padding: 8px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>RESPIRACIÓN CUADRÁTICA</h1>
        <p class="subtitle">Encuentra tu centro y calma tu mente</p>

        <div class="box-wrapper">
            <svg class="box-svg" viewBox="0 0 220 220">
                <rect class="box-bg" x="10" y="10" width="200" height="200" rx="8" />
                <rect class="box-progress" id="boxProgress" x="10" y="10" width="200" height="200" rx="8" />
            </svg>
            <div class="breathing-circle" id="circle">--</div>
        </div>

        <div class="instruction" id="instructionText">Haz clic en Iniciar</div>
        <div class="timer-info" id="cycleText">Ciclo: 0 / 4</div>

        <div class="controls">
            <button class="btn" id="startBtn" onclick="toggleExercise()">Iniciar Respiración</button>
            <button class="audio-toggle" id="audioBtn" onclick="toggleAudio()">🔊 Sonido: Activado</button>
        </div>
    </div>

    <!-- Carga de audios desde la carpeta Audios/ -->
    <audio id="audio1" src="Audios/Audio1.mp3" preload="auto"></audio>
    <audio id="audio2" src="Audios/Audio2.mp3" preload="auto"></audio>
    <audio id="audio3" src="Audios/Audio3.mp3" preload="auto"></audio>
    <audio id="audio4" src="Audios/Audio4.mp3" preload="auto"></audio>
    <audio id="audio5" src="Audios/Audio5.mp3" preload="auto"></audio>
    <audio id="audio6" src="Audios/Audio6.mp3" preload="auto"></audio>
    <audio id="audio7" src="Audios/Audio7.mp3" preload="auto"></audio>
    <audio id="audio8" src="Audios/Audio8.mp3" preload="auto"></audio>

    <script>
        let isRunning = false;
        let currentCycle = 0;
        const maxCycles = 4;
        const phaseSeconds = 4;
        
        let timerInterval = null;
        let audioEnabled = true;
        let currentPlayingAudio = null;

        const circle = document.getElementById('circle');
        const instructionText = document.getElementById('instructionText');
        const cycleText = document.getElementById('cycleText');
        const startBtn = document.getElementById('startBtn');
        const boxProgress = document.getElementById('boxProgress');
        const audioBtn = document.getElementById('audioBtn');

        const audios = {
            1: document.getElementById('audio1'),
            2: document.getElementById('audio2'),
            3: document.getElementById('audio3'),
            4: document.getElementById('audio4'),
            5: document.getElementById('audio5'),
            6: document.getElementById('audio6'),
            7: document.getElementById('audio7'),
            8: document.getElementById('audio8')
        };

        const TOTAL_PERIMETER = 800;

        function playAudioFile(audioElem) {
            return new Promise((resolve) => {
                if (!audioEnabled || !audioElem) {
                    resolve();
                    return;
                }
                stopAllAudios();
                currentPlayingAudio = audioElem;
                audioElem.currentTime = 0;
                audioElem.muted = !audioEnabled;
                
                audioElem.play().then(() => {
                    audioElem.onended = () => resolve();
                }).catch(err => {
                    console.log("Audio play blocked:", err);
                    resolve();
                });
            });
        }

        function stopAllAudios() {
            Object.values(audios).forEach(a => {
                if (a) {
                    a.pause();
                    a.currentTime = 0;
                }
            });
        }

        function toggleAudio() {
            audioEnabled = !audioEnabled;
            audioBtn.textContent = audioEnabled ? "🔊 Sonido: Activado" : "🔇 Sonido: Silenciado";
            Object.values(audios).forEach(a => {
                if (a) a.muted = !audioEnabled;
            });
        }

        async function toggleExercise() {
            if (isRunning) {
                stopExercise();
            } else {
                startExercise();
            }
        }

        async function startExercise() {
            isRunning = true;
            currentCycle = 0;
            startBtn.textContent = 'Detener';
            startBtn.style.backgroundColor = '#d9534f';

            // 1. Introducción y Postura (Audios 1 a 3)
            instructionText.textContent = "Escucha las indicaciones...";
            await playAudioFile(audios[1]);
            if (!isRunning) return;

            await playAudioFile(audios[2]);
            if (!isRunning) return;

            instructionText.textContent = "Toma una respiración profunda...";
            await playAudioFile(audios[3]);
            if (!isRunning) return;

            // 2. Iniciar Ciclos de Respiración Cuadrática
            runNextCycle();
        }

        function stopExercise() {
            isRunning = false;
            clearInterval(timerInterval);
            stopAllAudios();

            circle.style.transform = 'scale(1)';
            circle.style.backgroundColor = 'var(--primary-color)';
            circle.textContent = '--';
            instructionText.textContent = 'Haz clic en Iniciar';
            cycleText.textContent = 'Ciclo: 0 / 4';
            boxProgress.style.strokeDashoffset = TOTAL_PERIMETER;
            startBtn.textContent = 'Iniciar Respiración';
            startBtn.style.backgroundColor = 'var(--primary-color)';
        }

        function runNextCycle() {
            if (!isRunning) return;

            currentCycle++;
            if (currentCycle > maxCycles) {
                finishSession();
                return;
            }

            cycleText.textContent = `Ciclo: ${currentCycle} / ${maxCycles}`;

            // Seleccionar el audio del ciclo correspondiente (Audio 4 al 7)
            let cycleAudio = audios[currentCycle + 3];
            if (cycleAudio && audioEnabled) {
                cycleAudio.currentTime = 0;
                cycleAudio.muted = !audioEnabled;
                cycleAudio.play().catch(e => console.log(e));
            }

            // Ejecutar las 4 fases de animación del cuadrado sincronizadas
            runPhase('1. INHALA por la nariz', 'var(--accent-inhale)', 'inhale', () => {
                runPhase('2. SOSTÉN EL AIRE', 'var(--accent-hold1)', 'hold1', () => {
                    runPhase('3. EXHALA despacio', 'var(--accent-exhale)', 'exhale', () => {
                        runPhase('4. SOSTÉN EN VACÍO', 'var(--accent-hold2)', 'hold2', () => {
                            runNextCycle();
                        });
                    });
                });
            });
        }

        function runPhase(text, color, phaseType, onComplete) {
            if (!isRunning) return;

            instructionText.textContent = text;
            circle.style.backgroundColor = color;
            boxProgress.style.stroke = color;
            boxProgress.style.strokeDashoffset = TOTAL_PERIMETER;

            let startTime = Date.now();
            let totalMs = phaseSeconds * 1000;

            clearInterval(timerInterval);

            timerInterval = setInterval(() => {
                let elapsedMs = Date.now() - startTime;
                let progress = Math.min(elapsedMs / totalMs, 1);
                let currentSecond = Math.min(Math.floor(elapsedMs / 1000) + 1, 4);

                circle.textContent = currentSecond;

                let currentOffset = TOTAL_PERIMETER - (TOTAL_PERIMETER * progress);
                boxProgress.style.strokeDashoffset = currentOffset;

                if (phaseType === 'inhale') {
                    circle.style.transform = `scale(${1 + (0.5 * progress)})`;
                } else if (phaseType === 'hold1') {
                    circle.style.transform = 'scale(1.5)';
                } else if (phaseType === 'exhale') {
                    circle.style.transform = `scale(${1.5 - (0.5 * progress)})`;
                } else if (phaseType === 'hold2') {
                    circle.style.transform = 'scale(1)';
                }

                if (progress >= 1) {
                    clearInterval(timerInterval);
                    onComplete();
                }
            }, 20);
        }

        async function finishSession() {
            instructionText.textContent = 'Regresando a tu ritmo natural...';
            cycleText.textContent = 'Completado';
            
            // Audio 8: Cierre y regreso al presente
            await playAudioFile(audios[8]);
            
            instructionText.textContent = '¡Excelente trabajo!';
            stopExercise();
        }
    </script>
</body>
</html>
