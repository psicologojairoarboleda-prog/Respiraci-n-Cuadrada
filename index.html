<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Respiración Cuadrática - Box Breathing</title>
    <style>
        :root {
            --bg-color: #f4f0ea;
            --card-bg: #ffffff;
            --primary-color: #8b7bb0;
            --accent-inhale: #71b280;
            --accent-hold: #8b7bb0;
            --accent-exhale: #e08a68;
            --accent-empty: #5c9ead;
            --text-color: #2c2c2c;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 24px;
            padding: 30px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
            color: var(--primary-color);
        }

        p.subtitle {
            font-size: 0.9rem;
            color: #666;
            margin-top: 0;
            margin-bottom: 20px;
        }

        /* Contenedor del Cuadrado Animado */
        .box-wrapper {
            position: relative;
            width: 220px;
            height: 220px;
            margin: 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* SVG para el dibujo del borde cuadrado por fases */
        .box-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: rotate(-90deg); /* Inicia desde arriba */
        }

        .box-bg {
            fill: none;
            stroke: #e6e0d8;
            stroke-width: 8;
            rx: 16px;
        }

        .box-progress {
            fill: none;
            stroke: var(--primary-color);
            stroke-width: 8;
            stroke-linecap: round;
            rx: 16px;
            stroke-dasharray: 800; /* Longitud total aproximada del perímetro */
            stroke-dashoffset: 800;
            transition: stroke-dashoffset 0.1s linear, stroke 0.4s ease;
        }

        /* Círculo guía interior */
        .breathing-circle {
            width: 100px;
            height: 100px;
            background-color: var(--primary-color);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            font-size: 2.2rem;
            box-shadow: 0 0 20px rgba(0,0,0,0.08);
            transform: scale(1);
            transition: transform 1s linear, background-color 0.5s ease;
            z-index: 2;
        }

        .instruction {
            font-size: 1.2rem;
            font-weight: 600;
            min-height: 30px;
            margin: 15px 0 5px 0;
        }

        .timer-info {
            font-size: 0.9rem;
            color: #777;
            margin-bottom: 20px;
        }

        .controls {
            display: flex;
            gap: 10px;
            flex-direction: column;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s ease;
        }

        .audio-toggle {
            background: none;
            border: 1px solid #ccc;
            color: #555;
            padding: 8px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>RESPIRACIÓN CUADRÁTICA</h1>
        <p class="subtitle">4s Inhala · 4s Sostén · 4s Exhala · 4s Vacío</p>

        <div class="box-wrapper">
            <svg class="box-svg" viewBox="0 0 220 220">
                <rect class="box-bg" x="10" y="10" width="200" height="200" />
                <rect class="box-progress" id="boxProgress" x="10" y="10" width="200" height="200" />
            </svg>
            <div class="breathing-circle" id="circle">--</div>
        </div>

        <div class="instruction" id="instructionText">Haz clic en Iniciar</div>
        <div class="timer-info" id="cycleText">Ciclo: 0 / 4</div>

        <div class="controls">
            <button class="btn" id="startBtn" onclick="toggleExercise()">Iniciar Respiración</button>
            <button class="audio-toggle" id="audioBtn" onclick="toggleAudio()">🔊 Sonido: Activado</button>
        </div>
    </div>

    <script>
        let isRunning = false;
        let currentCycle = 0;
        const maxCycles = 4;
        const phaseDuration = 4; // 4 segundos exactos por fase (Cuadrática)
        
        let timerInterval = null;
        let audioEnabled = true;

        const circle = document.getElementById('circle');
        const instructionText = document.getElementById('instructionText');
        const cycleText = document.getElementById('cycleText');
        const startBtn = document.getElementById('startBtn');
        const boxProgress = document.getElementById('boxProgress');
        const audioBtn = document.getElementById('audioBtn');

        // Medida del perímetro del cuadrado en el SVG
        const PERIMETER = 800; 

        // Web Audio API para tonos relajantes sin archivos externos
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playTone(freq, type = 'sine', duration = 0.4) {
            if (!audioEnabled || !audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) { console.log(e); }
        }

        function toggleAudio() {
            audioEnabled = !audioEnabled;
            audioBtn.textContent = audioEnabled ? "🔊 Sonido: Activado" : "🔇 Sonido: Silenciado";
        }

        function toggleExercise() {
            initAudio();
            if (isRunning) {
                stopExercise();
            } else {
                startExercise();
            }
        }

        function startExercise() {
            isRunning = true;
            currentCycle = 0;
            startBtn.textContent = 'Detener';
            startBtn.style.backgroundColor = '#d9534f';
            runNextCycle();
        }

        function stopExercise() {
            isRunning = false;
            clearInterval(timerInterval);
            circle.style.transform = 'scale(1)';
            circle.style.backgroundColor = 'var(--primary-color)';
            circle.textContent = '--';
            instructionText.textContent = 'Haz clic en Iniciar';
            cycleText.textContent = 'Ciclo: 0 / 4';
            boxProgress.style.strokeDashoffset = PERIMETER;
            startBtn.textContent = 'Iniciar Respiración';
            startBtn.style.backgroundColor = 'var(--primary-color)';
        }

        function runNextCycle() {
            if (!isRunning) return;

            currentCycle++;
            if (currentCycle > maxCycles) {
                instructionText.textContent = '¡Sesión completada! Mente en calma.';
                playTone(523.25, 'sine', 0.8); // Do agudo final
                stopExercise();
                return;
            }

            cycleText.textContent = `Ciclo: ${currentCycle} / ${maxCycles}`;

            // Secuencia Cuadrática: Inhalar (4s) -> Sostener (4s) -> Exhalar (4s) -> Sostener Vacío (4s)
            executePhase('1. INHALA por la nariz', phaseDuration, 'inhale', 'var(--accent-inhale)', 261.63, () => {
                executePhase('2. SOSTÉN con aire', phaseDuration, 'hold-full', 'var(--accent-hold)', 329.63, () => {
                    executePhase('3. EXHALA despacio', phaseDuration, 'exhale', 'var(--accent-exhale)', 293.66, () => {
                        executePhase('4. SOSTÉN en vacío', phaseDuration, 'hold-empty', 'var(--accent-empty)', 220.00, () => {
                            runNextCycle();
                        });
                    });
                });
            });
        }

        function executePhase(text, seconds, type, color, toneFreq, onComplete) {
            if (!isRunning) return;

            instructionText.textContent = text;
            circle.style.backgroundColor = color;
            boxProgress.style.stroke = color;
            playTone(toneFreq, 'sine', 0.5);

            let startTime = Date.now();
            let totalMs = seconds * 1000;

            // Determinar tramo del perímetro del cuadrado según la fase (0..25%, 25..50%, etc.)
            let phaseIndex = type === 'inhale' ? 0 : type === 'hold-full' ? 1 : type === 'exhale' ? 2 : 3;
            let startOffset = PERIMETER - (PERIMETER * (phaseIndex / 4));
            let targetOffset = PERIMETER - (PERIMETER * ((phaseIndex + 1) / 4));

            clearInterval(timerInterval);

            timerInterval = setInterval(() => {
                let elapsedMs = Date.now() - startTime;
                let progress = Math.min(elapsedMs / totalMs, 1);
                let remainingSec = Math.ceil(seconds - (elapsedMs / 1000));

                if (remainingSec >= 0) {
                    circle.textContent = remainingSec > 0 ? remainingSec : 1;
                }

                // Animación continua del trazo del cuadrado
                let currentOffset = startOffset - ((startOffset - targetOffset) * progress);
                boxProgress.style.strokeDashoffset = currentOffset;

                // Animación de tamaño del círculo
                if (type === 'inhale') {
                    circle.style.transform = `scale(${1 + (0.6 * progress)})`;
                } else if (type === 'hold-full') {
                    circle.style.transform = 'scale(1.6)';
                } else if (type === 'exhale') {
                    circle.style.transform = `scale(${1.6 - (0.6 * progress)})`;
                } else if (type === 'hold-empty') {
                    circle.style.transform = 'scale(1)';
                }

                if (progress >= 1) {
                    clearInterval(timerInterval);
                    onComplete();
                }
            }, 30);
        }
    </script>
</body>
</html>
