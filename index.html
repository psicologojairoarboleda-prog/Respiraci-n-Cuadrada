<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Respiración Cuadrática - Meditación Guiada</title>
    <style>
        :root {
            --bg-color: #f4f0ea;
            --card-bg: #ffffff;
            --primary-color: #8b7bb0;
            --accent-inhale: #71b280;
            --accent-hold1: #8b7bb0;
            --accent-exhale: #e08a68;
            --accent-hold2: #5c9ead;
            --text-color: #2c2c2c;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 24px;
            padding: 30px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
            color: var(--primary-color);
        }

        p.subtitle {
            font-size: 0.9rem;
            color: #666;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .box-wrapper {
            position: relative;
            width: 240px;
            height: 240px;
            margin: 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .box-bg {
            fill: none;
            stroke: #e6e0d8;
            stroke-width: 6;
        }

        /* Cuadrado Grande: Cada lado es una Fase (Inhalar, Sostener, Exhalar, Vacío) */
        .box-large-progress {
            fill: none;
            stroke: var(--primary-color);
            stroke-width: 8;
            stroke-linecap: round;
            stroke-dasharray: 800;
            stroke-dashoffset: 800;
            transition: stroke 0.3s ease;
        }

        /* Cuadrado Pequeño Interior: Cada lado es 1 segundo (da 4 vueltas completas por fase) */
        .box-small-progress {
            fill: none;
            stroke: #ffffff;
            stroke-width: 4;
            stroke-dasharray: 400;
            stroke-dashoffset: 400;
            opacity: 0.8;
        }

        .breathing-circle {
            width: 70px;
            height: 70px;
            background-color: var(--primary-color);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            font-size: 1.8rem;
            box-shadow: 0 0 15px rgba(0,0,0,0.08);
            transform: scale(1);
            transition: background-color 0.4s ease;
            z-index: 2;
        }

        .instruction {
            font-size: 1.1rem;
            font-weight: 600;
            min-height: 40px;
            margin: 15px 0 5px 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .timer-info {
            font-size: 0.9rem;
            color: #777;
            margin-bottom: 20px;
        }

        .controls {
            display: flex;
            gap: 10px;
            flex-direction: column;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s ease;
        }

        .btn-skip {
            background-color: #d1cbe1;
            color: #4a3f6b;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            display: none;
            transition: background-color 0.2s ease;
        }

        .btn-skip:hover {
            background-color: #bfaedc;
        }

        .audio-toggle {
            background: none;
            border: 1px solid #ccc;
            color: #555;
            padding: 8px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>RESPIRACIÓN CUADRÁTICA</h1>
        <p class="subtitle">Encuentra tu centro y calma tu mente</p>

        <div class="box-wrapper">
            <svg class="box-svg" viewBox="0 0 240 240">
                <!-- Cuadrado Grande (Fases: 1 lado por fase) -->
                <rect class="box-bg" x="20" y="20" width="200" height="200" rx="8" />
                <rect class="box-large-progress" id="largeProgress" x="20" y="20" width="200" height="200" rx="8" />
                
                <!-- Cuadrado Pequeño Interior (Segundos: 1 lado por segundo, 4 vueltas por fase) -->
                <rect class="box-bg" x="70" y="70" width="100" height="100" rx="4" />
                <rect class="box-small-progress" id="smallProgress" x="70" y="70" width="100" height="100" rx="4" />
            </svg>
            <div class="breathing-circle" id="circle">--</div>
        </div>

        <div class="instruction" id="instructionText">Haz clic en Iniciar</div>
        <div class="timer-info" id="cycleText">Ciclo: 0 / 4</div>

        <div class="controls">
            <button class="btn" id="startBtn" onclick="toggleExercise()">Iniciar Respiración</button>
            <button class="btn-skip" id="skipBtn" onclick="skipIntro()">⏭️ Saltar Introducción</button>
            <button class="audio-toggle" id="audioBtn" onclick="toggleAudio()">🔊 Sonido: Activado</button>
        </div>
    </div>

    <!-- Audios Locutados (del 1 al 8) -->
    <audio id="audio1" src="Audios/Audio1.mp3" preload="auto"></audio>
    <audio id="audio2" src="Audios/Audio2.mp3" preload="auto"></audio>
    <audio id="audio3" src="Audios/Audio3.mp3" preload="auto"></audio>
    <audio id="audio4" src="Audios/Audio4.mp3" preload="auto"></audio>
    <audio id="audio5" src="Audios/Audio5.mp3" preload="auto"></audio>
    <audio id="audio6" src="Audios/Audio6.mp3" preload="auto"></audio>
    <audio id="audio7" src="Audios/Audio7.mp3" preload="auto"></audio>
    <audio id="audio8" src="Audios/Audio8.mp3" preload="auto"></audio>

    <script>
        let isRunning = false;
        let currentCycle = 0;
        const maxCycles = 4;
        
        let animationInterval = null;
        let audioEnabled = true;
        let isDuringIntro = false;

        // Web Audio API para música ambiental sintética interna (sin archivos externos bloqueados)
        let audioCtx = null;
        let ambientNode = null;
        let ambientGain = null;

        const circle = document.getElementById('circle');
        const instructionText = document.getElementById('instructionText');
        const cycleText = document.getElementById('cycleText');
        const startBtn = document.getElementById('startBtn');
        const skipBtn = document.getElementById('skipBtn');
        const largeProgress = document.getElementById('largeProgress');
        const smallProgress = document.getElementById('smallProgress');
        const audioBtn = document.getElementById('audioBtn');

        const audios = {
            1: document.getElementById('audio1'),
            2: document.getElementById('audio2'),
            3: document.getElementById('audio3'),
            4: document.getElementById('audio4'),
            5: document.getElementById('audio5'),
            6: document.getElementById('audio6'),
            7: document.getElementById('audio7'),
            8: document.getElementById('audio8')
        };

        const LARGE_PERIMETER = 800; // 4 lados de 200px
        const SMALL_PERIMETER = 400; // 4 lados de 100px

        function initAmbientMusic() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            if (!ambientNode && audioEnabled) {
                try {
                    // Creamos un acorde ambiental relajante mediante osciladores armónicos
                    ambientNode = audioCtx.createOscillator();
                    let osc2 = audioCtx.createOscillator();
                    ambientGain = audioCtx.createGain();

                    ambientNode.type = 'sine';
                    ambientNode.frequency.setValueAtTime(130.81, audioCtx.currentTime); // Nota Do (C3)
                    osc2.type = 'triangle';
                    osc2.frequency.setValueAtTime(196.00, audioCtx.currentTime); // Nota Sol (G3)

                    ambientGain.gain.setValueAtTime(0.02, audioCtx.currentTime); // Volumen sutilísimo para no opacar la voz

                    ambientNode.connect(ambientGain);
                    osc2.connect(ambientGain);
                    ambientGain.connect(audioCtx.destination);

                    ambientNode.start();
                    osc2.start();
                } catch(e) { console.log(e); }
            } else if (ambientGain && audioEnabled) {
                ambientGain.gain.setValueAtTime(0.02, audioCtx.currentTime);
            }
        }

        function stopAmbientMusic() {
            if (ambientGain && audioCtx) {
                try {
                    ambientGain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
                } catch(e) {}
            }
        }

        function playAudioDynamic(audioElem) {
            return new Promise((resolve) => {
                if (!audioEnabled || !audioElem) {
                    resolve();
                    return;
                }
                audioElem.currentTime = 0;
                audioElem.muted = !audioEnabled;
                audioElem.play().then(() => {
                    audioElem.onended = () => resolve();
                }).catch(err => {
                    console.log("Audio play blocked:", err);
                    resolve();
                });
            });
        }

        function stopAllAudios() {
            Object.values(audios).forEach(a => {
                if (a) {
                    a.pause();
                    a.currentTime = 0;
                }
            });
            stopAmbientMusic();
        }

        function toggleAudio() {
            audioEnabled = !audioEnabled;
            audioBtn.textContent = audioEnabled ? "🔊 Sonido: Activado" : "🔇 Sonido: Silenciado";
            Object.values(audios).forEach(a => { if (a) a.muted = !audioEnabled; });
            if (!audioEnabled) {
                stopAmbientMusic();
            } else if (isRunning) {
                initAmbientMusic();
            }
        }

        async function toggleExercise() {
            if (isRunning) {
                stopExercise();
            } else {
                startExercise();
            }
        }

        async function startExercise() {
            if (isRunning) return;
            isRunning = true;
            startBtn.textContent = 'Detener';
            startBtn.style.backgroundColor = '#d9534f';
            skipBtn.style.display = 'block';
            isDuringIntro = true;

            if (audioEnabled) {
                initAmbientMusic();
            }

            instructionText.textContent = "Preparación...";
            await playAudioDynamic(audios[1]);
            if (!isRunning || !isDuringIntro) return;

            await playAudioDynamic(audios[2]);
            if (!isRunning || !isDuringIntro) return;

            instructionText.textContent = "Toma aire profundo...";
            await playAudioDynamic(audios[3]);
            if (!isRunning || !isDuringIntro) return;

            skipBtn.style.display = 'none';
            isDuringIntro = false;

            currentCycle = 0;
            runNextCycle();
        }

        function skipIntro() {
            if (!isDuringIntro) return;
            audios[1].pause();
            audios[2].pause();
            audios[3].pause();
            
            isDuringIntro = false;
            skipBtn.style.display = 'none';

            currentCycle = 0;
            runNextCycle();
        }

        function stopExercise() {
            isRunning = false;
            isDuringIntro = false;
            skipBtn.style.display = 'none';
            clearInterval(animationInterval);
            stopAllAudios();

            circle.style.transform = 'scale(1)';
            circle.style.backgroundColor = 'var(--primary-color)';
            circle.textContent = '--';
            instructionText.textContent = 'Haz clic en Iniciar';
            cycleText.textContent = 'Ciclo: 0 / 4';
            largeProgress.style.strokeDashoffset = LARGE_PERIMETER;
            smallProgress.style.strokeDashoffset = SMALL_PERIMETER;
            startBtn.textContent = 'Iniciar Respiración';
            startBtn.style.backgroundColor = 'var(--primary-color)';
        }

        async function runNextCycle() {
            if (!isRunning) return;

            currentCycle++;
            if (currentCycle > maxCycles) {
                finishSession();
                return;
            }

            cycleText.textContent = `Ciclo: ${currentCycle} / ${maxCycles}`;

            let cycleAudio = audios[currentCycle + 3];

            if (audioEnabled && cycleAudio) {
                let durationMs = (cycleAudio.duration && !isNaN(cycleAudio.duration)) ? cycleAudio.duration * 1000 : 16000;
                
                cycleAudio.currentTime = 0;
                cycleAudio.muted = !audioEnabled;
                cycleAudio.play().catch(e => console.log(e));

                await runSyncedPhases(durationMs);
            } else {
                await runSyncedPhases(16000);
            }

            if (isRunning) {
                runNextCycle();
            }
        }

        function runSyncedPhases(totalAudioDurationMs) {
            return new Promise((resolve) => {
                let startTime = Date.now();
                let phaseTimeMs = totalAudioDurationMs / 4; // Duración exacta de 1 fase (aprox 4s)

                clearInterval(animationInterval);

                animationInterval = setInterval(() => {
                    if (!isRunning) {
                        clearInterval(animationInterval);
                        resolve();
                        return;
                    }

                    let elapsed = Date.now() - startTime;
                    let currentPhaseIndex = Math.floor(elapsed / phaseTimeMs);
                    if (currentPhaseIndex > 3) currentPhaseIndex = 3;

                    let phaseElapsed = elapsed - (currentPhaseIndex * phaseTimeMs);
                    let phaseProgress = Math.min(phaseElapsed / phaseTimeMs, 1);
                    
                    // Conteo de segundos (1 a 4) dentro de la fase actual
                    let currentSecond = Math.min(Math.floor(phaseElapsed / (phaseTimeMs / 4)) + 1, 4);
                    circle.textContent = currentSecond;

                    // CUADRADO GRANDE: 1 lado por cada fase (4 fases en total)
                    let largeStartOffset = LARGE_PERIMETER - (currentPhaseIndex * 200);
                    let largeTargetOffset = largeStartOffset - (200 * phaseProgress);
                    largeProgress.style.strokeDashoffset = largeTargetOffset;

                    // CUADRADO PEQUEÑO INTERIOR: Cada lado es 1 segundo (da 1 vuelta completa de 4 lados por fase)
                    let secondProgress = (phaseElapsed % (phaseTimeMs / 4)) / (phaseTimeMs / 4);
                    let smallOffset = SMALL_PERIMETER - (SMALL_PERIMETER * secondProgress);
                    smallProgress.style.strokeDashoffset = smallOffset;

                    // Textos y colores según la fase
                    if (currentPhaseIndex === 0) {
                        instructionText.textContent = "1. INHALA por la nariz";
                        largeProgress.style.stroke = "var(--accent-inhale)";
                        circle.style.backgroundColor = "var(--accent-inhale)";
                    } else if (currentPhaseIndex === 1) {
                        instructionText.textContent = "2. SOSTÉN EL AIRE";
                        largeProgress.style.stroke = "var(--accent-hold1)";
                        circle.style.backgroundColor = "var(--accent-hold1)";
                    } else if (currentPhaseIndex === 2) {
                        instructionText.textContent = "3. EXHALA despacio";
                        largeProgress.style.stroke = "var(--accent-exhale)";
                        circle.style.backgroundColor = "var(--accent-exhale)";
                    } else if (currentPhaseIndex === 3) {
                        instructionText.textContent = "4. SOSTÉN EN VACÍO";
                        largeProgress.style.stroke = "var(--accent-hold2)";
                        circle.style.backgroundColor = "var(--accent-hold2)";
                    }

                    if (elapsed >= totalAudioDurationMs) {
                        clearInterval(animationInterval);
                        resolve();
                    }
                }, 20);
            });
        }

        async function finishSession() {
            instructionText.textContent = 'Regresando a tu ritmo natural...';
            cycleText.textContent = 'Completado';
            
            await playAudioDynamic(audios[8]);
            
            instructionText.textContent = '¡Excelente trabajo!';
            stopExercise();
        }
    </script>
</body>
</html>
