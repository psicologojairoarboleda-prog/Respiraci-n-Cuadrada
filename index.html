<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Respiración Cuadrática - Meditación Guiada</title>
    <style>
        :root {
            --bg-color: #f4f0ea;
            --card-bg: #ffffff;
            --primary-color: #8b7bb0;
            --accent-inhale: #71b280;
            --accent-hold1: #8b7bb0;
            --accent-exhale: #e08a68;
            --accent-hold2: #5c9ead;
            --text-color: #2c2c2c;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 24px;
            padding: 30px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
            color: var(--primary-color);
        }

        p.subtitle {
            font-size: 0.9rem;
            color: #666;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .box-wrapper {
            position: relative;
            width: 240px;
            height: 240px;
            margin: 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .box-bg {
            fill: none;
            stroke: #e6e0d8;
            stroke-width: 6;
        }

        .box-large-progress {
            fill: none;
            stroke: var(--primary-color);
            stroke-width: 8;
            stroke-linecap: round;
            stroke-dasharray: 800;
            stroke-dashoffset: 800;
            transition: stroke 0.3s ease;
        }

        .box-small-progress {
            fill: none;
            stroke: #ffffff;
            stroke-width: 4;
            stroke-dasharray: 400;
            stroke-dashoffset: 400;
            opacity: 0.95;
        }

        .breathing-circle {
            width: 70px;
            height: 70px;
            background-color: var(--primary-color);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            font-size: 1.8rem;
            box-shadow: 0 0 15px rgba(0,0,0,0.08);
            transform: scale(1);
            transition: background-color 0.4s ease;
            z-index: 2;
        }

        .instruction {
            font-size: 1.1rem;
            font-weight: 600;
            min-height: 40px;
            margin: 15px 0 5px 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .timer-info {
            font-size: 0.9rem;
            color: #777;
            margin-bottom: 20px;
        }

        .controls {
            display: flex;
            gap: 10px;
            flex-direction: column;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s ease;
        }

        .btn-skip {
            background-color: #d1cbe1;
            color: #4a3f6b;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            display: none;
            transition: background-color 0.2s ease;
        }

        .btn-skip:hover {
            background-color: #bfaedc;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>RESPIRACIÓN CUADRÁTICA</h1>
        <p class="subtitle">Encuentra tu centro y calma tu mente</p>

        <div class="box-wrapper">
            <svg class="box-svg" viewBox="0 0 240 240">
                <rect class="box-bg" x="20" y="20" width="200" height="200" rx="8" />
                <rect class="box-large-progress" id="largeProgress" x="20" y="20" width="200" height="200" rx="8" />
                <rect class="box-bg" x="70" y="70" width="100" height="100" rx="4" />
                <rect class="box-small-progress" id="smallProgress" x="70" y="70" width="100" height="100" rx="4" />
            </svg>
            <div class="breathing-circle" id="circle">--</div>
        </div>

        <div class="instruction" id="instructionText">Haz clic en Iniciar</div>
        <div class="timer-info" id="cycleText">Ciclo: 0 / 4</div>

        <div class="controls">
            <button class="btn" id="startBtn" onclick="toggleExercise()">Iniciar Respiración</button>
            <button class="btn-skip" id="skipBtn" onclick="skipIntro()">⏭️ Saltar Introducción</button>
        </div>
    </div>

    <!-- Elementos de Audio con rutas relativas limpias -->
    <audio id="audio1" src="Audios/Audio1_2.mp3" preload="auto"></audio>
    <audio id="audio2" src="Audios/Audio2_2.mp3" preload="auto"></audio>
    <audio id="audio3" src="Audios/Audio3_2.mp3" preload="auto"></audio>
    <audio id="audio4" src="Audios/Audio4_2.mp3" preload="auto"></audio>
    <audio id="audio5" src="Audios/Audio5_2.mp3" preload="auto"></audio>
    <audio id="audio6" src="Audios/Audio6_2.mp3" preload="auto"></audio>
    <audio id="audio7" src="Audios/Audio7_2.mp3" preload="auto"></audio>
    <audio id="audio8" src="Audios/Audio8_2.mp3" preload="auto"></audio>
    <audio id="bgAudio" src="Audios/Audio9_2.mp3" preload="auto" loop></audio>

    <script src="script.js"></script>
</body>
</html>
