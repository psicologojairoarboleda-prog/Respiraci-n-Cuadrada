<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guía de Respiración Cuadrada | Práctica Guiada</title>
    <style>
        :root {
            --bg-color: #f7f5f0;
            --card-bg: #ffffff;
            --text-color: #4a453f;
            --accent-color: #8c8275;
            --accent-light: #d6cfc7;
            --shadow-color: rgba(0, 0, 0, 0.05);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            max-width: 500px;
            width: 90%;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px var(--shadow-color);
            text-align: center;
            box-sizing: border-box;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 500;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        p.subtitle {
            font-size: 0.95rem;
            color: var(--accent-color);
            margin-bottom: 30px;
        }

        .breathing-circle {
            width: 180px;
            height: 180px;
            border: 4px solid var(--accent-light);
            border-radius: 50%;
            margin: 0 auto 30px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            font-weight: 500;
            transition: all 1s ease;
            position: relative;
        }

        .instructions-box {
            background-color: var(--bg-color);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
            min-height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.05rem;
            font-weight: 400;
        }

        button {
            background-color: var(--text-color);
            color: #ffffff;
            border: none;
            padding: 14px 32px;
            font-size: 1rem;
            border-radius: 30px;
            cursor: pointer;
            transition: opacity 0.2s ease, transform 0.1s ease;
        }

        button:hover {
            opacity: 0.9;
        }

        button:active {
            transform: scale(0.98);
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Respiración Cuadrada</h1>
        <p class="subtitle">Encuentra tu calma y presencia</p>

        <div class="instructions-box" id="instructionText">
            Presiona el botón para iniciar la práctica de respiración.
        </div>

        <div class="breathing-circle" id="circle">
            <span id="statusLabel">Listo</span>
        </div>

        <button id="startButton" onclick="startPractice()">Iniciar Práctica</button>
    </div>

    <!-- Elemento de Audio de Fondo (Audio 9) -->
    <!-- Nota: Asegúrate de que la ruta de la carpeta en tu repositorio sea correcta -->
    <audio id="bgMusic" src="audio/Audio9.mp3" preload="auto" loop></audio>

    <script>
        const bgMusic = document.getElementById('bgMusic');
        const startButton = document.getElementById('startButton');
        const instructionText = document.getElementById('instructionText');
        const statusLabel = document.getElementById('statusLabel');
        const circle = document.getElementById('circle');

        // Lista de audios secuenciales del 1 al 8
        const guideAudioFiles = [
            'audio/Audio1.mp3',
            'audio/Audio2.mp3',
            'audio/Audio3.mp3',
            'audio/Audio4.mp3',
            'audio/Audio5.mp3',
            'audio/Audio6.mp3',
            'audio/Audio7.mp3',
            'audio/Audio8.mp3'
        ];

        let currentAudioIndex = 0;
        let activeGuideAudio = null;

        function startPractice() {
            // Ocultar botón y preparar interfaz
            startButton.classList.add('hidden');
            instructionText.innerText = "Comenzando ejercicio de respiración...";

            // 1. Iniciar la música de fondo (Audio 9) desde el segundo 0 exacto
            bgMusic.currentTime = 0;
            bgMusic.play().catch(error => {
                console.log("Reproducción de fondo bloqueada o error:", error);
            });

            // 2. Iniciar la secuencia de audios guías de 1 a 8
            playNextGuideAudio();
        }

        function playNextGuideAudio() {
            if (currentAudioIndex < guideAudioFiles.length) {
                activeGuideAudio = new Audio(guideAudioFiles[currentAudioIndex]);
                
                activeGuideAudio.play().then(() => {
                    statusLabel.innerText = `Guía ${currentAudioIndex + 1}/8`;
                }).catch(err => {
                    console.log("Error al reproducir audio guía:", err);
                });

                // Cuando termine el audio actual de la guía, pasar al siguiente de forma fluida
                activeGuideAudio.onended = () => {
                    currentAudioIndex++;
                    playNextGuideAudio();
                };
            } else {
                // Al terminar todos los audios de guía (del 1 al 8)
                instructionText.innerText = "Práctica finalizada. Gracias por meditar.";
                statusLabel.innerText = "Finalizado";
                
                // Opcional: desvanecer o detener la música de fondo al terminar
                // bgMusic.pause(); 
            }
        }
    </script>
</body>
</html>
