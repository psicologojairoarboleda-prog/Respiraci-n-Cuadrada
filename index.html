<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guía de Respiración Cuadrada</title>
    <style>
        :root {
            --bg-color: #f7f5f0;
            --card-bg: #ffffff;
            --text-color: #4a453f;
            --accent-color: #8c8275;
            --accent-light: #d6cfc7;
            --shadow-color: rgba(0, 0, 0, 0.05);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            max-width: 480px;
            width: 90%;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px var(--shadow-color);
            text-align: center;
            box-sizing: border-box;
        }

        h1 {
            font-size: 1.4rem;
            font-weight: 500;
            margin-bottom: 6px;
        }

        p.subtitle {
            font-size: 0.9rem;
            color: var(--accent-color);
            margin-bottom: 35px;
        }

        .breathing-circle {
            width: 160px;
            height: 160px;
            border: 4px solid var(--accent-light);
            border-radius: 50%;
            margin: 0 auto 30px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1rem;
            font-weight: 500;
        }

        .instructions-box {
            background-color: var(--bg-color);
            padding: 18px;
            border-radius: 12px;
            margin-bottom: 30px;
            min-height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.95rem;
        }

        button {
            background-color: var(--text-color);
            color: #ffffff;
            border: none;
            padding: 14px 32px;
            font-size: 0.95rem;
            border-radius: 30px;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        button:hover {
            opacity: 0.9;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Respiración Cuadrada</h1>
        <p class="subtitle">Práctica guiada</p>

        <div class="instructions-box" id="instructionText">
            Presiona el botón para comenzar la práctica.
        </div>

        <div class="breathing-circle" id="circle">
            <span id="statusLabel">Listo</span>
        </div>

        <button id="startButton" onclick="initPractice()">Iniciar Práctica</button>
    </div>

    <script>
        // LISTA DE AUDIOS: Asegúrate de que los nombres coincidan exactamente en tu repositorio
        const guideFiles = [
            'Audio1.mp3',
            'Audio2.mp3',
            'Audio3.mp3',
            'Audio4.mp3',
            'Audio5.mp3',
            'Audio6.mp3',
            'Audio7.mp3',
            'Audio8.mp3'
        ];
        const bgFile = 'Audio9.mp3';

        let currentIndex = 0;
        const bgAudio = new Audio(bgFile);
        const guideAudio = new Audio();

        bgAudio.loop = true;
        bgAudio.volume = 0.35; // Volumen de fondo suave

        function initPractice() {
            const btn = document.getElementById('startButton');
            btn.classList.add('hidden');
            
            document.getElementById('instructionText').innerText = "Iniciando práctica...";
            
            // 1. Reproducir música de fondo (Audio 9) desde el segundo 0 exacto
            bgAudio.currentTime = 0;
            bgAudio.play().catch(err => console.log("Error en música de fondo:", err));

            // 2. Iniciar la secuencia de la guía (1 al 8)
            playStep(0);
        }

        function playStep(index) {
            if (index >= guideFiles.length) {
                document.getElementById('instructionText').innerText = "Práctica finalizada.";
                document.getElementById('statusLabel').innerText = "Completado";
                bgAudio.pause();
                return;
            }

            currentIndex = index;
            guideAudio.src = guideFiles[currentIndex];
            guideAudio.load();

            document.getElementById('statusLabel').innerText = `Paso ${currentIndex + 1} de 8`;

            guideAudio.play().then(() => {
                document.getElementById('instructionText').innerText = "Sigue la guía de respiración...";
            }).catch(error => {
                console.error("Error reproduciendo " + guideFiles[currentIndex], error);
                // Si hay un error con un archivo, salta al siguiente para no bloquear la web
                playStep(currentIndex + 1);
            });

            // Al terminar el audio actual, salta al siguiente paso automáticamente
            guideAudio.onended = () => {
                playStep(currentIndex + 1);
            };
        }
    </script>
</body>
</html>
