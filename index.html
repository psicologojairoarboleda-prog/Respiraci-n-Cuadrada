<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Respiración Cuadrática - Meditación Guiada</title>
    <style>
        :root {
            --bg-color: #f4f0ea;
            --card-bg: #ffffff;
            --primary-color: #8b7bb0;
            --accent-inhale: #71b280;
            --accent-hold1: #8b7bb0;
            --accent-exhale: #e08a68;
            --accent-hold2: #5c9ead;
            --text-color: #2c2c2c;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 24px;
            padding: 30px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
            color: var(--primary-color);
        }

        p.subtitle {
            font-size: 0.9rem;
            color: #666;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .box-wrapper {
            position: relative;
            width: 220px;
            height: 220px;
            margin: 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .box-bg {
            fill: none;
            stroke: #e6e0d8;
            stroke-width: 8;
        }

        /* Cuadrado exterior: avanza 1 lado por segundo */
        .box-outer-progress {
            fill: none;
            stroke: var(--primary-color);
            stroke-width: 8;
            stroke-linecap: round;
            stroke-dasharray: 800;
            stroke-dashoffset: 800;
            transition: stroke 0.3s ease;
        }

        /* Cuadrado interior: representa la fase completa */
        .box-inner-bg {
            fill: none;
            stroke: var(--primary-color);
            stroke-width: 4;
            opacity: 0.3;
            transform-origin: center;
            transition: transform 0.2s linear, stroke 0.3s ease;
        }

        .breathing-circle {
            width: 90px;
            height: 90px;
            background-color: var(--primary-color);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            font-size: 2.2rem;
            box-shadow: 0 0 20px rgba(0,0,0,0.08);
            transform: scale(1);
            transition: transform 0.1s linear, background-color 0.4s ease;
            z-index: 2;
        }

        .instruction {
            font-size: 1.1rem;
            font-weight: 600;
            min-height: 40px;
            margin: 15px 0 5px 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .timer-info {
            font-size: 0.9rem;
            color: #777;
            margin-bottom: 20px;
        }

        .controls {
            display: flex;
            gap: 10px;
            flex-direction: column;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s ease;
        }

        .btn-skip {
            background-color: #d1cbe1;
            color: #4a3f6b;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            display: none;
            transition: background-color 0.2s ease;
        }

        .btn-skip:hover {
            background-color: #bfaedc;
        }

        .audio-toggle {
            background: none;
            border: 1px solid #ccc;
            color: #555;
            padding: 8px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>RESPIRACIÓN CUADRÁTICA</h1>
        <p class="subtitle">Encuentra tu centro y calma tu mente</p>

        <div class="box-wrapper">
            <svg class="box-svg" viewBox="0 0 220 220">
                <!-- Fondo del cuadrado exterior -->
                <rect class="box-bg" x="10" y="10" width="200" height="200" rx="8" />
                <!-- Cuadrado exterior (1 lado = 1 segundo) -->
                <rect class="box-outer-progress" id="outerProgress" x="10" y="10" width="200" height="200" rx="8" />
                <!-- Cuadrado interior (Escala según fase) -->
                <rect class="box-inner-bg" id="innerSquare" x="40" y="40" width="140" height="140" rx="6" />
            </svg>
            <div class="breathing-circle" id="circle">--</div>
        </div>

        <div class="instruction" id="instructionText">Haz clic en Iniciar</div>
        <div class="timer-info" id="cycleText">Ciclo: 0 / 4</div>

        <div class="controls">
            <button class="btn" id="startBtn" onclick="toggleExercise()">Iniciar Respiración</button>
            <button class="btn-skip" id="skipBtn" onclick="skipIntro()">⏭️ Saltar Introducción</button>
            <button class="audio-toggle" id="audioBtn" onclick="toggleAudio()">🔊 Sonido: Activado</button>
        </div>
    </div>

    <!-- Locuciones subidas por el usuario -->
    <audio id="audio1" src="Audios/Audio1.mp3" preload="auto"></audio>
    <audio id="audio2" src="Audios/Audio2.mp3" preload="auto"></audio>
    <audio id="audio3" src="Audios/Audio3.mp3" preload="auto"></audio>
    <audio id="audio4" src="Audios/Audio4.mp3" preload="auto"></audio>
    <audio id="audio5" src="Audios/Audio5.mp3" preload="auto"></audio>
    <audio id="audio6" src="Audios/Audio6.mp3" preload="auto"></audio>
    <audio id="audio7" src="Audios/Audio7.mp3" preload="auto"></audio>
    <audio id="audio8" src="Audios/Audio8.mp3" preload="auto"></audio>

    <!-- Pista de música ambiental suave desde CDN libre (sin requerir archivo local) -->
    <audio id="bgAudio" src="https://cdn.pixabay.com/download/audio/2022/05/16/audio_c8b9d628f8.mp3" preload="auto" loop></audio>

    <script>
        let isRunning = false;
        let currentCycle = 0;
        const maxCycles = 4;
        
        let animationInterval = null;
        let audioEnabled = true;
        let isDuringIntro = false;

        const circle = document.getElementById('circle');
        const instructionText = document.getElementById('instructionText');
        const cycleText = document.getElementById('cycleText');
        const startBtn = document.getElementById('startBtn');
        const skipBtn = document.getElementById('skipBtn');
        const outerProgress = document.getElementById('outerProgress');
        const innerSquare = document.getElementById('innerSquare');
        const audioBtn = document.getElementById('audioBtn');
        const bgAudio = document.getElementById('bgAudio');

        // Música relajante al 8% de volumen
        bgAudio.volume = 0.08;

        const audios = {
            1: document.getElementById('audio1'),
            2: document.getElementById('audio2'),
            3: document.getElementById('audio3'),
            4: document.getElementById('audio4'),
            5: document.getElementById('audio5'),
            6: document.getElementById('audio6'),
            7: document.getElementById('audio7'),
            8: document.getElementById('audio8')
        };

        const TOTAL_PERIMETER = 800;

        function playAudioDynamic(audioElem) {
            return new Promise((resolve) => {
                if (!audioEnabled || !audioElem) {
                    resolve();
                    return;
                }
                audioElem.currentTime = 0;
                audioElem.muted = !audioEnabled;
                audioElem.play().then(() => {
                    audioElem.onended = () => resolve();
                }).catch(err => {
                    console.log("Audio play blocked:", err);
                    resolve();
                });
            });
        }

        function stopAllAudios() {
            Object.values(audios).forEach(a => {
                if (a) {
                    a.pause();
                    a.currentTime = 0;
                }
            });
            bgAudio.pause();
            bgAudio.currentTime = 0;
        }

        function toggleAudio() {
            audioEnabled = !audioEnabled;
            audioBtn.textContent = audioEnabled ? "🔊 Sonido: Activado" : "🔇 Sonido: Silenciado";
            Object.values(audios).forEach(a => { if (a) a.muted = !audioEnabled; });
            bgAudio.muted = !audioEnabled;
        }

        async function toggleExercise() {
            if (isRunning) {
                stopExercise();
            } else {
                startExercise();
            }
        }

        async function startExercise() {
            if (isRunning) return;
            isRunning = true;
            startBtn.textContent = 'Detener';
            startBtn.style.backgroundColor = '#d9534f';
            skipBtn.style.display = 'block';
            isDuringIntro = true;

            if (audioEnabled) {
                bgAudio.currentTime = 0;
                bgAudio.play().catch(e => console.log(e));
            }

            instructionText.textContent = "Preparación...";
            await playAudioDynamic(audios[1]);
            if (!isRunning || !isDuringIntro) return;

            await playAudioDynamic(audios[2]);
            if (!isRunning || !isDuringIntro) return;

            instructionText.textContent = "Toma aire profundo...";
            await playAudioDynamic(audios[3]);
            if (!isRunning || !isDuringIntro) return;

            skipBtn.style.display = 'none';
            isDuringIntro = false;

            currentCycle = 0;
            runNextCycle();
        }

        function skipIntro() {
            if (!isDuringIntro) return;
            audios[1].pause();
            audios[2].pause();
            audios[3].pause();
            
            isDuringIntro = false;
            skipBtn.style.display = 'none';

            currentCycle = 0;
            runNextCycle();
        }

        function stopExercise() {
            isRunning = false;
            isDuringIntro = false;
            skipBtn.style.display = 'none';
            clearInterval(animationInterval);
            stopAllAudios();

            circle.style.transform = 'scale(1)';
            circle.style.backgroundColor = 'var(--primary-color)';
            circle.textContent = '--';
            instructionText.textContent = 'Haz clic en Iniciar';
            cycleText.textContent = 'Ciclo: 0 / 4';
            outerProgress.style.strokeDashoffset = TOTAL_PERIMETER;
            innerSquare.style.transform = 'scale(1)';
            startBtn.textContent = 'Iniciar Respiración';
            startBtn.style.backgroundColor = 'var(--primary-color)';
        }

        async function runNextCycle() {
            if (!isRunning) return;

            currentCycle++;
            if (currentCycle > maxCycles) {
                finishSession();
                return;
            }

            cycleText.textContent = `Ciclo: ${currentCycle} / ${maxCycles}`;

            let cycleAudio = audios[currentCycle + 3];

            if (audioEnabled && cycleAudio) {
                let durationMs = (cycleAudio.duration && !isNaN(cycleAudio.duration)) ? cycleAudio.duration * 1000 : 16000;
                
                cycleAudio.currentTime = 0;
                cycleAudio.muted = !audioEnabled;
                cycleAudio.play().catch(e => console.log(e));

                await runSyncedPhases(durationMs);
            } else {
                await runSyncedPhases(16000);
            }

            if (isRunning) {
                runNextCycle();
            }
        }

        function runSyncedPhases(totalAudioDurationMs) {
            return new Promise((resolve) => {
                let startTime = Date.now();
                let phaseTimeMs = totalAudioDurationMs / 4; 

                clearInterval(animationInterval);

                animationInterval = setInterval(() => {
                    if (!isRunning) {
                        clearInterval(animationInterval);
                        resolve();
                        return;
                    }

                    let elapsed = Date.now() - startTime;
                    let currentPhaseIndex = Math.floor(elapsed / phaseTimeMs);
                    if (currentPhaseIndex > 3) currentPhaseIndex = 3;

                    let phaseElapsed = elapsed - (currentPhaseIndex * phaseTimeMs);
                    let phaseProgress = Math.min(phaseElapsed / phaseTimeMs, 1);
                    
                    // Conteo descendente/ascendente de 1 a 4 segundos por fase
                    let currentSecond = Math.min(Math.floor(phaseElapsed / (phaseTimeMs / 4)) + 1, 4);
                    circle.textContent = currentSecond;

                    // 1 LADO = 1 SEGUNDO en el cuadrado exterior (200px por segundo)
                    let sideProgress = (phaseElapsed % (phaseTimeMs / 4)) / (phaseTimeMs / 4);
                    let outerOffset = TOTAL_PERIMETER - (((currentSecond - 1) * 200) + (200 * sideProgress));
                    outerProgress.style.strokeDashoffset = outerOffset;

                    // Configuración visual por Fase
                    if (currentPhaseIndex === 0) {
                        instructionText.textContent = "1. INHALA por la nariz";
                        outerProgress.style.stroke = "var(--accent-inhale)";
                        innerSquare.style.stroke = "var(--accent-inhale)";
                        circle.style.backgroundColor = "var(--accent-inhale)";
                        circle.style.transform = `scale(${1 + (0.4 * phaseProgress)})`;
                        innerSquare.style.transform = `scale(${1 + (0.2 * phaseProgress)})`;
                    } else if (currentPhaseIndex === 1) {
                        instructionText.textContent = "2. SOSTÉN EL AIRE";
                        outerProgress.style.stroke = "var(--accent-hold1)";
                        innerSquare.style.stroke = "var(--accent-hold1)";
                        circle.style.backgroundColor = "var(--accent-hold1)";
                        circle.style.transform = "scale(1.4)";
                        innerSquare.style.transform = "scale(1.2)";
                    } else if (currentPhaseIndex === 2) {
                        instructionText.textContent = "3. EXHALA despacio";
                        outerProgress.style.stroke = "var(--accent-exhale)";
                        innerSquare.style.stroke = "var(--accent-exhale)";
                        circle.style.backgroundColor = "var(--accent-exhale)";
                        circle.style.transform = `scale(${1.4 - (0.4 * phaseProgress)})`;
                        innerSquare.style.transform = `scale(${1.2 - (0.2 * phaseProgress)})`;
                    } else if (currentPhaseIndex === 3) {
                        instructionText.textContent = "4. SOSTÉN EN VACÍO";
                        outerProgress.style.stroke = "var(--accent-hold2)";
                        innerSquare.style.stroke = "var(--accent-hold2)";
                        circle.style.backgroundColor = "var(--accent-hold2)";
                        circle.style.transform = "scale(1)";
                        innerSquare.style.transform = "scale(1)";
                    }

                    if (elapsed >= totalAudioDurationMs) {
                        clearInterval(animationInterval);
                        resolve();
                    }
                }, 20);
            });
        }

        async function finishSession() {
            instructionText.textContent = 'Regresando a tu ritmo natural...';
            cycleText.textContent = 'Completado';
            
            await playAudioDynamic(audios[8]);
            
            instructionText.textContent = '¡Excelente trabajo!';
            stopExercise();
        }
    </script>
</body>
</html>
