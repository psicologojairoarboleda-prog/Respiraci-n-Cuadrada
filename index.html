<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba de Sonido - Respiración</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f0ea;
            color: #2c2c2c;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        button {
            background-color: #8b7bb0;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            margin: 10px 0;
            width: 100%;
        }
        button:hover {
            background-color: #726298;
        }
        .audio-item {
            margin: 10px 0;
            text-align: left;
            font-size: 0.9rem;
        }
        audio {
            width: 100%;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Panel de Diagnóstico de Sonido</h1>
        <p>Si los audios funcionan aquí, el problema de reproducción estará completamente resuelto.</p>

        <button onclick="probarSecuencia()">▶️ Probar Reproducción Secuencial</button>
        <button onclick="detenerTodo()" style="background-color: #d9534f;">⏹️ Detener Todo</button>

        <p id="estado" style="font-weight: bold; color: #5c9ead; margin: 15px 0;">Estado: En espera</p>

        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #ddd;">

        <h3>Controles individuales (para verificar archivos):</h3>
        
        <div class="audio-item">
            <label>Fondo (Audio9_2.mp3):</label>
            <audio id="bgAudio" src="Audios/Audio9_2.mp3" controls loop></audio>
        </div>

        <div class="audio-item">
            <label>Audio 1_2:</label>
            <audio src="Audios/Audio1_2.mp3" controls></audio>
        </div>

        <div class="audio-item">
            <label>Audio 4_2 (Primer Ciclo):</label>
            <audio src="Audios/Audio4_2.mp3" controls></audio>
        </div>
    </div>

    <script>
        const bgAudio = document.getElementById('bgAudio');
        bgAudio.volume = 0.12;

        const audiosSecuencia = [
            document.getElementById('audio1') || new Audio('Audios/Audio1_2.mp3'),
            document.getElementById('audio2') || new Audio('Audios/Audio2_2.mp3'),
            document.getElementById('audio3') || new Audio('Audios/Audio3_2.mp3'),
            document.getElementById('audio4') || new Audio('Audios/Audio4_2.mp3')
        ];

        let indexActual = 0;
        let reproduciendo = false;

        async function probarSecuencia() {
            if (reproduciendo) return;
            reproduciendo = true;
            
            document.getElementById('estado').textContent = "Estado: Iniciando música de fondo...";
            
            try {
                // Iniciar fondo saltando el silencio inicial (ej. segundo 4)
                bgAudio.currentTime = 4.0;
                await bgAudio.play();
            } catch (e) {
                console.log("Error en fondo:", e);
            }

            reproducirSiguienteAudio();
        }

        function reproducirSiguienteAudio() {
            if (!reproduciendo) return;

            if (indexActual < audiosSecuencia.length) {
                let audio = audiosSecuencia[indexActual];
                document.getElementById('estado').textContent = `Estado: Reproduciendo Audio ${indexActual + 1}_2.mp3`;
                
                audio.currentTime = 0;
                audio.play().then(() => {
                    audio.onended = () => {
                        indexActual++;
                        reproducirSiguienteAudio();
                    };
                }).catch(err => {
                    document.getElementById('estado').textContent = `Error en Audio ${indexActual + 1}: Revisa la ruta`;
                    console.error(err);
                });
            } else {
                document.getElementById('estado').textContent = "Estado: Secuencia de prueba finalizada con éxito.";
                reproduciendo = false;
            }
        }

        function detenerTodo() {
            reproduciendo = false;
            bgAudio.pause();
            bgAudio.currentTime = 0;
            audiosSecuencia.forEach(a => {
                a.pause();
                a.currentTime = 0;
                a.onended = null;
            });
            indexActual = 0;
            document.getElementById('estado').textContent = "Estado: Detenido manualmente.";
        }
    </script>
</body>
</html>
