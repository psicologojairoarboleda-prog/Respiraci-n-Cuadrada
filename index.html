<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Respiración Cuadrada - Calm</title>
    <style>
        :root {
            --bg-color: #f4f0ea;
            --card-bg: #ffffff;
            --primary-color: #8b7bb0;
            --text-color: #2c2c2c;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 24px;
            padding: 30px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
            color: var(--primary-color);
        }

        p.subtitle {
            font-size: 0.95rem;
            color: #666;
            margin-top: 0;
            margin-bottom: 20px;
        }

        /* Contenedor del Cuadrado de Respiración */
        .box-container {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 20px auto;
        }

        .box-svg {
            width: 200px;
            height: 200px;
            transform: rotate(-90deg); /* Empieza arriba a la izquierda */
        }

        .box-bg {
            fill: none;
            stroke: #eee;
            stroke-width: 8;
            stroke-linecap: round;
        }

        .box-progress {
            fill: none;
            stroke: var(--primary-color);
            stroke-width: 8;
            stroke-linecap: round;
            stroke-dasharray: 800; /* Perímetro total del cuadrado (200x4) */
            stroke-dashoffset: 800; /* Empieza completamente vacío */
            transition: stroke-dashoffset 1s linear;
        }

        .box-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .instruction {
            font-size: 1.1rem;
            font-weight: 600;
            min-height: 30px;
            margin-bottom: 5px;
            color: var(--primary-color);
        }

        .counter {
            font-size: 2.2rem;
            font-weight: bold;
        }

        .timer-info {
            font-size: 0.9rem;
            color: #777;
            margin-bottom: 20px;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s ease;
            margin-top: 8px;
        }

        .btn-skip {
            background-color: #a0a0a0;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>RESPIRACIÓN CUADRADA</h1>
        <p class="subtitle">Cada lado del cuadro es una fase de 4 segundos</p>

        <div class="box-container">
            <svg class="box-svg" viewBox="0 0 200 200">
                <!-- Marco de fondo gris -->
                <rect class="box-bg" x="10" y="10" width="180" height="180" rx="15"/>
                <!-- Marco que se va llenando dinámicamente -->
                <rect id="boxProgress" class="box-progress" x="10" y="10" width="180" height="180" rx="15"/>
            </svg>
            <div class="box-content">
                <div class="instruction" id="instructionText">Haz clic en Iniciar</div>
                <div class="counter" id="counterText">--</div>
            </div>
        </div>

        <div class="timer-info" id="cycleText">Ciclo: 0 / 4</div>

        <button class="btn" id="startBtn" onclick="toggleExercise()">Iniciar Respiración</button>
        <button class="btn btn-skip" id="skipBtn" onclick="skipIntro()">Saltar Intro</button>
    </div>

    <script>
        // Música de fondo (Audio9.mp3)
        const bgMusic = new Audio('Audios/Audio9.mp3');
        bgMusic.loop = true;
        bgMusic.volume = 0.3;

        // Audios de voz
        const voiceAudios = {
            intro: new Audio('Audios/Audio1.mp3'),
            technique: new Audio('Audios/Audio2.mp3'),
            prep: new Audio('Audios/Audio3.mp3'),
            cycle1: new Audio('Audios/Audio4.mp3'),
            cycle2: new Audio('Audios/Audio5.mp3'),
            cycle3: new Audio('Audios/Audio6.mp3'),
            cycle4: new Audio('Audios/Audio7.mp3'),
            outro: new Audio('Audios/Audio8.mp3')
        };

        let isRunning = false;
        let currentVoiceAudio = null;
        let currentTimer = null;
        let phaseInterval = null;

        const instructionText = document.getElementById('instructionText');
        const counterText = document.getElementById('counterText');
        const cycleText = document.getElementById('cycleText');
        const startBtn = document.getElementById('startBtn');
        const skipBtn = document.getElementById('skipBtn');
        const boxProgress = document.getElementById('boxProgress');

        // Perímetro total del rectángulo SVG (180 * 4 = 720)
        const TOTAL_PERIMETER = 720;
        boxProgress.style.strokeDasharray = TOTAL_PERIMETER;
        boxProgress.style.strokeDashoffset = TOTAL_PERIMETER;

        function toggleExercise() {
            if (isRunning) {
                stopExercise();
            } else {
                startExercise();
            }
        }

        function playVoiceSequence(audioObj, text, onEndedCallback) {
            if (!isRunning) return;
            
            instructionText.textContent = text;
            counterText.textContent = "--";
            currentVoiceAudio = audioObj;
            currentVoiceAudio.currentTime = 0;
            
            currentVoiceAudio.play().catch(err => {
                console.warn("Error al reproducir voz:", err);
                if (isRunning && onEndedCallback) onEndedCallback();
            });
            
            currentVoiceAudio.onended = () => {
                if (isRunning && onEndedCallback) {
                    onEndedCallback();
                }
            };
        }

        function startExercise() {
            isRunning = true;
            startBtn.textContent = 'Detener';
            startBtn.style.backgroundColor = '#d9534f';
            skipBtn.style.display = 'block';

            // Iniciar música de fondo en el segundo 10
            bgMusic.currentTime = 10;
            bgMusic.play().catch(err => console.warn("Música bloqueada:", err));

            // Secuencia de introducción
            playVoiceSequence(voiceAudios.intro, "Escucha las indicaciones...", () => {
                playVoiceSequence(voiceAudios.technique, "Técnica de respiración...", () => {
                    playVoiceSequence(voiceAudios.prep, "Prepárate...", () => {
                        skipBtn.style.display = 'none';
                        runCycleSequence(1);
                    });
                });
            });
        }

        function skipIntro() {
            if (!isRunning) return;

            if (currentVoiceAudio) {
                currentVoiceAudio.pause();
                currentVoiceAudio.currentTime = 0;
                currentVoiceAudio.onended = null;
            }
            if (currentTimer) clearTimeout(currentTimer);
            if (phaseInterval) clearInterval(phaseInterval);

            skipBtn.style.display = 'none';
            runCycleSequence(1);
        }

        function stopExercise() {
            isRunning = false;
            
            bgMusic.pause();
            bgMusic.currentTime = 10;

            if (currentVoiceAudio) {
                currentVoiceAudio.pause();
                currentVoiceAudio.currentTime = 0;
                currentVoiceAudio.onended = null;
            }
            if (currentTimer) clearTimeout(currentTimer);
            if (phaseInterval) clearInterval(phaseInterval);

            // Resetear interfaz
            boxProgress.style.transition = 'none';
            boxProgress.style.strokeDashoffset = TOTAL_PERIMETER;
            instructionText.textContent = 'Haz clic en Iniciar';
            counterText.textContent = '--';
            cycleText.textContent = 'Ciclo: 0 / 4';
            startBtn.textContent = 'Iniciar Respiración';
            startBtn.style.backgroundColor = 'var(--primary-color)';
            skipBtn.style.display = 'none';
        }

        function runCycleSequence(cycleNum) {
            if (!isRunning) return;

            if (cycleNum > 4) {
                cycleText.textContent = `Ciclo: 4 / 4`;
                playVoiceSequence(voiceAudios.outro, "Finalizando...", () => {
                    instructionText.textContent = '¡Excelente trabajo!';
                    counterText.textContent = '✨';
                    stopExercise();
                });
                return;
            }

            cycleText.textContent = `Ciclo: ${cycleNum} / 4`;
            const cycleAudio = voiceAudios[`cycle${cycleNum}`];
            currentVoiceAudio = cycleAudio;
            currentVoiceAudio.currentTime = 0;

            instructionText.textContent = `Ciclo ${cycleNum}`;
            counterText.textContent = "...";

            cycleAudio.play().catch(err => console.warn("Error ciclo audio:", err));

            // Sincronización exacta con el audio del ciclo:
            // 1. Esperamos 3.5 segundos para que termine la intro hablada del ciclo ("Ciclo 1...") y empiece el conteo de la voz.
            currentTimer = setTimeout(() => {
                if (!isRunning) return;
                startBoxBreathingPhases();
            }, 3500);

            cycleAudio.onended = () => {
                if (isRunning) {
                    runCycleSequence(cycleNum + 1);
                }
            };
        }

        // Ejecuta las 4 fases del cuadrado compuestas de 4 segundos cada una
        function startBoxBreathingPhases() {
            if (!isRunning) return;

            // Fase 1: INHALAR (Lado Superior - Offset de 720 a 540)
            runPhase("Inhala", 720, 540, () => {
                if (!isRunning) return;
                // Fase 2: SOSTENER (Lado Derecho - Offset de 540 a 360)
                runPhase("Sostén", 540, 360, () => {
                    if (!isRunning) return;
                    // Fase 3: EXHALAR (Lado Inferior - Offset de 360 a 180)
                    runPhase("Exhala", 360, 180, () => {
                        if (!isRunning) return;
                        // Fase 4: VACÍO / PAUSA (Lado Izquierdo - Offset de 180 a 0)
                        runPhase("Vacío", 180, 0, () => {});
                    });
                });
            });
        }

        function runPhase(text, startOffset, targetOffset, onComplete) {
            if (!isRunning) return;

            instructionText.textContent = text;
            let secondsLeft = 4;
            counterText.textContent = secondsLeft;

            // Animar el trazo del lado del cuadro durante 4 segundos exactos
            boxProgress.style.transition = 'stroke-dashoffset 4s linear';
            boxProgress.style.strokeDashoffset = targetOffset;

            phaseInterval = setInterval(() => {
                secondsLeft--;
                if (secondsLeft > 0 && isRunning) {
                    counterText.textContent = secondsLeft;
                }
            }, 1000);

            currentTimer = setTimeout(() => {
                clearInterval(phaseInterval);
                if (onComplete) onComplete();
            }, 4000);
        }
    </script>
</body>
</html>
