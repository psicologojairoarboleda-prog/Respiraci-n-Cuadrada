<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Respiración Guiada - Calm</title>
    <style>
        :root {
            --bg-color: #f4f0ea;
            --card-bg: #ffffff;
            --primary-color: #8b7bb0;
            --text-color: #2c2c2c;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 24px;
            padding: 30px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
            color: var(--primary-color);
        }

        p.subtitle {
            font-size: 0.95rem;
            color: #666;
            margin-top: 0;
            margin-bottom: 30px;
        }

        .circle-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 220px;
            margin: 20px 0;
        }

        .breathing-circle {
            width: 110px;
            height: 110px;
            background-color: var(--primary-color);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            font-size: 1.8rem;
            box-shadow: 0 0 20px rgba(139, 123, 176, 0.3);
            transform: scale(1);
        }

        .instruction {
            font-size: 1.1rem;
            font-weight: 600;
            min-height: 45px;
            margin: 15px 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .timer-info {
            font-size: 0.9rem;
            color: #777;
            margin-bottom: 20px;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s ease;
            margin-top: 8px;
        }

        .btn-skip {
            background-color: #a0a0a0;
            display: none; /* Oculto por defecto */
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>RESPIRACIÓN CUADRADA</h1>
        <p class="subtitle">Respira para calmar tu cuerpo y mente</p>

        <div class="circle-container">
            <div class="breathing-circle" id="circle">--</div>
        </div>

        <div class="instruction" id="instructionText">Haz clic en Iniciar</div>
        <div class="timer-info" id="cycleText">Ciclo: 0 / 4</div>

        <button class="btn" id="startBtn" onclick="toggleExercise()">Iniciar Respiración</button>
        <button class="btn btn-skip" id="skipBtn" onclick="skipIntro()">Saltar Intro</button>
    </div>

    <script>
        // Música de fondo (Audio9.mp3)
        const bgMusic = new Audio('Audios/Audio9.mp3');
        bgMusic.loop = true;
        bgMusic.volume = 0.3;

        // Audios de voz
        const voiceAudios = {
            intro: new Audio('Audios/Audio1.mp3'),
            technique: new Audio('Audios/Audio2.mp3'),
            prep: new Audio('Audios/Audio3.mp3'),
            cycle1: new Audio('Audios/Audio4.mp3'),
            cycle2: new Audio('Audios/Audio5.mp3'),
            cycle3: new Audio('Audios/Audio6.mp3'),
            cycle4: new Audio('Audios/Audio7.mp3'),
            outro: new Audio('Audios/Audio8.mp3')
        };

        let isRunning = false;
        let currentVoiceAudio = null;
        let currentTimeout = null;

        const circle = document.getElementById('circle');
        const instructionText = document.getElementById('instructionText');
        const cycleText = document.getElementById('cycleText');
        const startBtn = document.getElementById('startBtn');
        const skipBtn = document.getElementById('skipBtn');

        const MIN_SCALE = 1.0;
        const MAX_SCALE = 1.8;

        function toggleExercise() {
            if (isRunning) {
                stopExercise();
            } else {
                startExercise();
            }
        }

        // Reproduce una pista de voz y avanza al terminar
        function playVoiceSequence(audioObj, text, onEndedCallback) {
            if (!isRunning) return;
            
            instructionText.textContent = text;
            currentVoiceAudio = audioObj;
            currentVoiceAudio.currentTime = 0;
            
            currentVoiceAudio.play().catch(err => {
                console.warn("Error al reproducir voz:", err);
                if (isRunning && onEndedCallback) onEndedCallback();
            });
            
            currentVoiceAudio.onended = () => {
                if (isRunning && onEndedCallback) {
                    onEndedCallback();
                }
            };
        }

        function startExercise() {
            isRunning = true;
            startBtn.textContent = 'Detener';
            startBtn.style.backgroundColor = '#d9534f';
            skipBtn.style.display = 'block'; // Mostrar botón saltar intro

            // Iniciar música de fondo en el segundo 10
            bgMusic.currentTime = 10;
            bgMusic.play().catch(err => console.warn("Música bloqueada:", err));

            // Secuencia de introducción
            playVoiceSequence(voiceAudios.intro, "Escucha las indicaciones...", () => {
                playVoiceSequence(voiceAudios.technique, "Técnica de respiración...", () => {
                    playVoiceSequence(voiceAudios.prep, "Prepárate...", () => {
                        skipBtn.style.display = 'none'; // Ocultar saltar intro al iniciar los ciclos
                        runCycleSequence(1);
                    });
                });
            });
        }

        // Función para el botón "Saltar Intro"
        function skipIntro() {
            if (!isRunning) return;

            // Detener audio de intro actual
            if (currentVoiceAudio) {
                currentVoiceAudio.pause();
                currentVoiceAudio.currentTime = 0;
                currentVoiceAudio.onended = null;
            }
            if (currentTimeout) {
                clearTimeout(currentTimeout);
            }

            skipBtn.style.display = 'none';
            runCycleSequence(1); // Saltar directo al ciclo 1
        }

        function stopExercise() {
            isRunning = false;
            
            bgMusic.pause();
            bgMusic.currentTime = 10;

            if (currentVoiceAudio) {
                currentVoiceAudio.pause();
                currentVoiceAudio.currentTime = 0;
                currentVoiceAudio.onended = null;
            }
            if (currentTimeout) {
                clearTimeout(currentTimeout);
            }

            // Resetear interfaz
            circle.style.transition = 'none';
            circle.style.transform = `scale(${MIN_SCALE})`;
            circle.style.backgroundColor = 'var(--primary-color)';
            circle.textContent = '--';
            instructionText.textContent = 'Haz clic en Iniciar';
            cycleText.textContent = 'Ciclo: 0 / 4';
            startBtn.textContent = 'Iniciar Respiración';
            startBtn.style.backgroundColor = 'var(--primary-color)';
            skipBtn.style.display = 'none';
        }

        // Ejecuta los ciclos adaptándose exactamente a la duración del audio de voz correspondiente
        function runCycleSequence(cycleNum) {
            if (!isRunning) return;

            if (cycleNum > 4) {
                cycleText.textContent = `Ciclo: 4 / 4`;
                playVoiceSequence(voiceAudios.outro, "Finalizando...", () => {
                    instructionText.textContent = '¡Excelente trabajo! Te has relajado.';
                    stopExercise();
                });
                return;
            }

            cycleText.textContent = `Ciclo: ${cycleNum} / 4`;
            const cycleAudio = voiceAudios[`cycle${cycleNum}`];
            currentVoiceAudio = cycleAudio;
            currentVoiceAudio.currentTime = 0;

            instructionText.textContent = `Ciclo ${cycleNum} en curso...`;

            // Reproducir el audio del ciclo y sincronizar las animaciones con su duración real
            cycleAudio.play().then(() => {
                const totalDuration = cycleAudio.duration; // Duración real del archivo de voz
                if (isNaN(totalDuration) || totalDuration <= 0) {
                    fallbackCycle(cycleNum);
                    return;
                }

                // La respiración cuadrada divide el audio en 4 partes iguales exactas
                const phaseDuration = totalDuration / 4; 

                // Fase 1: Inhalar
                setPhaseAnimation('Inhala por la nariz...', '#9d8ec2', MAX_SCALE, phaseDuration, () => {
                    if (!isRunning) return;
                    // Fase 2: Sostener
                    setPhaseAnimation('Sostén el aire...', '#8b7bb0', MAX_SCALE, phaseDuration, () => {
                        if (!isRunning) return;
                        // Fase 3: Exhalar
                        setPhaseAnimation('Exhala lentamente...', '#bdae8b', MIN_SCALE, phaseDuration, () => {
                            if (!isRunning) return;
                            // Fase 4: Pausa / Vacío
                            setPhaseAnimation('Mantén en vacío...', '#779ecb', MIN_SCALE, phaseDuration, () => {});
                        });
                    });
                });

            }).catch(err => {
                console.warn("Error al reproducir audio del ciclo:", err);
                fallbackCycle(cycleNum);
            });

            cycleAudio.onended = () => {
                if (isRunning) {
                    runCycleSequence(cycleNum + 1);
                }
            };
        }

        // Controla la transición suave de tamaño y color sincronizada con la fase
        function setPhaseAnimation(text, color, targetScale, durationSeconds, onPhaseComplete) {
            if (!isRunning) return;

            instructionText.textContent = text;
            circle.style.backgroundColor = color;
            
            // Aplicar la transición de CSS exactamente con la duración de esta fase del audio
            circle.style.transition = `transform ${durationSeconds}s linear, background-color 0.5s ease`;
            circle.style.transform = `scale(${targetScale})`;

            // Contador visual dinámico dentro del círculo
            let remaining = Math.ceil(durationSeconds);
            circle.textContent = remaining;

            const interval = setInterval(() => {
                remaining--;
                if (remaining > 0 && isRunning) {
                    circle.textContent = remaining;
                }
            }, 1000);

            currentTimeout = setTimeout(() => {
                clearInterval(interval);
                if (onPhaseComplete) onPhaseComplete();
            }, durationSeconds * 1000);
        }

        function fallbackCycle(cycleNum) {
            // Plan de respaldo por si el navegador bloquea la lectura de duración del audio
            runCycleSequence(cycleNum + 1);
        }
    </script>
</body>
</html>
