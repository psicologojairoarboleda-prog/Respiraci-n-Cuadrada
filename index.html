<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Respiración Cuadrada - Calm</title>
    <style>
        :root {
            --bg-color: #f4f0ea;
            --card-bg: #ffffff;
            --primary-color: #8b7bb0;
            --text-color: #2c2c2c;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 24px;
            padding: 30px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
            color: var(--primary-color);
        }

        p.subtitle {
            font-size: 0.95rem;
            color: #666;
            margin-top: 0;
            margin-bottom: 15px;
        }

        /* Texto de instrucción ubicado arriba del cuadro */
        .instruction {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 15px;
            min-height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Contenedor del Cuadrado de Respiración */
        .box-container {
            position: relative;
            width: 220px;
            height: 220px;
            margin: 10px auto 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 220px;
            height: 220px;
            transform: rotate(-90deg); /* Empieza arriba a la izquierda */
            pointer-events: none;
            z-index: 2;
        }

        .box-bg {
            fill: none;
            stroke: #eee;
            stroke-width: 8;
            stroke-linecap: round;
        }

        .box-progress {
            fill: none;
            stroke: var(--primary-color);
            stroke-width: 8;
            stroke-linecap: round;
            stroke-dasharray: 760; /* Perímetro total (190 * 4) */
            stroke-dashoffset: 760; /* Empieza vacío */
        }

        /* GIF central realzado con sombra y fondo de respaldo, completamente visible */
        .center-graphic {
            position: absolute;
            width: 150px;
            height: 150px;
            border-radius: 16px;
            object-fit: cover;
            z-index: 1;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            background-color: #faf8f5;
        }

        .timer-info {
            font-size: 0.9rem;
            color: #777;
            margin-bottom: 20px;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s ease;
            margin-top: 8px;
        }

        .btn-skip {
            background-color: #a0a0a0;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>RESPIRACIÓN CUADRADA</h1>
        <p class="subtitle">Sigue el ritmo de la armonía interior</p>

        <!-- Texto de instrucción arriba del cuadro -->
        <div class="instruction" id="instructionText">Listo</div>

        <div class="box-container">
            <!-- GIF ubicado en la carpeta Imagenes -->
            <img src="Imagenes/GIF1.gif" alt="Meditación" class="center-graphic" id="meditationGif">
            
            <svg class="box-svg" viewBox="0 0 220 220">
                <rect class="box-bg" x="15" y="15" width="190" height="190" rx="20"/>
                <rect id="boxProgress" class="box-progress" x="15" y="15" width="190" height="190" rx="20"/>
            </svg>
        </div>

        <div class="timer-info" id="cycleText">Ciclo: 0 / 4</div>

        <button class="btn" id="startBtn" onclick="toggleExercise()">Iniciar Respiración</button>
        <button class="btn btn-skip" id="skipBtn" onclick="skipIntro()">Saltar Intro</button>
    </div>

    <script>
        // Música de fondo (Audio9.mp3 dentro de la carpeta Audios)
        const bgMusic = new Audio('Audios/Audio9.mp3');
        bgMusic.loop = true;
        bgMusic.volume = 0.3;

        // Audios de voz dentro de la carpeta Audios
        const voiceAudios = {
            intro: new Audio('Audios/Audio1.mp3'),
            technique: new Audio('Audios/Audio2.mp3'),
            prep: new Audio('Audios/Audio3.mp3'),
            cycle1: new Audio('Audios/Audio4.mp3'),
            cycle2: new Audio('Audios/Audio5.mp3'),
            cycle3: new Audio('Audios/Audio6.mp3'),
            cycle4: new Audio('Audios/Audio7.mp3'),
            outro: new Audio('Audios/Audio8.mp3')
        };

        let isRunning = false;
        let currentVoiceAudio = null;
        let animationFrameId = null;

        const instructionText = document.getElementById('instructionText');
        const cycleText = document.getElementById('cycleText');
        const startBtn = document.getElementById('startBtn');
        const skipBtn = document.getElementById('skipBtn');
        const boxProgress = document.getElementById('boxProgress');

        // Perímetro total del rectángulo SVG (190 * 4 = 760)
        const TOTAL_PERIMETER = 760;
        boxProgress.style.strokeDasharray = TOTAL_PERIMETER;
        boxProgress.style.strokeDashoffset = TOTAL_PERIMETER;

        function toggleExercise() {
            if (isRunning) {
                stopExercise();
            } else {
                startExercise();
            }
        }

        function playVoiceSequence(audioObj, text, onEndedCallback) {
            if (!isRunning) return;
            
            instructionText.textContent = text;
            currentVoiceAudio = audioObj;
            currentVoiceAudio.currentTime = 0;
            
            // Recortar silencio inicial excesivo del Audio 1 a 2 segundos
            if (audioObj === voiceAudios.intro) {
                currentVoiceAudio.currentTime = 2.0;
            }
            
            currentVoiceAudio.play().catch(err => {
                console.warn("Error al reproducir voz:", err);
                if (isRunning && onEndedCallback) onEndedCallback();
            });
            
            currentVoiceAudio.onended = () => {
                if (isRunning && onEndedCallback) {
                    onEndedCallback();
                }
            };
        }

        function startExercise() {
            isRunning = true;
            startBtn.textContent = 'Detener';
            startBtn.style.backgroundColor = '#d9534f';
            skipBtn.style.display = 'block';

            // Iniciar música de fondo en el segundo 10
            bgMusic.currentTime = 10;
            bgMusic.play().catch(err => console.warn("Música bloqueada:", err));

            playVoiceSequence(voiceAudios.intro, "Indicaciones", () => {
                playVoiceSequence(voiceAudios.technique, "Técnica", () => {
                    playVoiceSequence(voiceAudios.prep, "Prepárate", () => {
                        skipBtn.style.display = 'none';
                        runCycleSequence(1);
                    });
                });
            });
        }

        function skipIntro() {
            if (!isRunning) return;

            if (currentVoiceAudio) {
                currentVoiceAudio.pause();
                currentVoiceAudio.currentTime = 0;
                currentVoiceAudio.onended = null;
            }
            if (animationFrameId) cancelAnimationFrame(animationFrameId);

            skipBtn.style.display = 'none';
            runCycleSequence(1);
        }

        function stopExercise() {
            isRunning = false;
            
            bgMusic.pause();
            bgMusic.currentTime = 10;

            if (currentVoiceAudio) {
                currentVoiceAudio.pause();
                currentVoiceAudio.currentTime = 0;
                currentVoiceAudio.onended = null;
            }
            if (animationFrameId) cancelAnimationFrame(animationFrameId);

            boxProgress.style.transition = 'none';
            boxProgress.style.strokeDashoffset = TOTAL_PERIMETER;
            instructionText.textContent = 'Listo';
            cycleText.textContent = 'Ciclo: 0 / 4';
            startBtn.textContent = 'Iniciar Respiración';
            startBtn.style.backgroundColor = 'var(--primary-color)';
            skipBtn.style.display = 'none';
        }

        function runCycleSequence(cycleNum) {
            if (!isRunning) return;

            if (cycleNum > 4) {
                cycleText.textContent = `Ciclo: 4 / 4`;
                playVoiceSequence(voiceAudios.outro, "Completado", () => {
                    instructionText.textContent = '¡Paz!';
                    stopExercise();
                });
                return;
            }

            cycleText.textContent = `Ciclo: ${cycleNum} / 4`;
            const cycleAudio = voiceAudios[`cycle${cycleNum}`];
            currentVoiceAudio = cycleAudio;
            currentVoiceAudio.currentTime = 0;

            instructionText.textContent = `Ciclo ${cycleNum}`;

            cycleAudio.play().catch(err => console.warn("Error ciclo audio:", err));

            // Sincronización milimétrica robusta con validación y reintento de metadatos de duración
            function syncWithAudio() {
                if (!isRunning || currentVoiceAudio !== cycleAudio) return;

                const t = cycleAudio.currentTime;
                const duration = (cycleAudio.duration && !isNaN(cycleAudio.duration) && cycleAudio.duration > 0) ? cycleAudio.duration : 16;
                
                // Tiempo de espera exacto antes de que empiece "Inhala" (Ciclo 1: 5.2s, Ciclos 2-4: 3.0s)
                const introOffset = (cycleNum === 1) ? 5.2 : 3.0; 
                const breathingDuration = Math.max(1, duration - introOffset);

                if (t < introOffset) {
                    boxProgress.style.strokeDashoffset = TOTAL_PERIMETER;
                    instructionText.textContent = `Ciclo ${cycleNum}`;
                } else if (t >= introOffset) {
                    const elapsedBreathing = t - introOffset;
                    const progress = Math.min(1, Math.max(0, elapsedBreathing / breathingDuration));
                    
                    // División estricta en 4 fases secuenciales sin superposiciones
                    const phaseIndex = Math.min(3, Math.floor(progress * 4));
                    const phaseProgress = Math.min(1, Math.max(0, (progress * 4) - phaseIndex));

                    let targetOffset = TOTAL_PERIMETER;

                    if (phaseIndex === 0) {
                        // Fase 1: INHALAR (Lado superior: 760 -> 570)
                        instructionText.textContent = "Inhala";
                        targetOffset = TOTAL_PERIMETER - (phaseProgress * 190);
                    } else if (phaseIndex === 1) {
                        // Fase 2: SOSTENER (Lado derecho: 570 -> 380)
                        instructionText.textContent = "Sostén";
                        targetOffset = 570 - (phaseProgress * 190);
                    } else if (phaseIndex === 2) {
                        // Fase 3: EXHALAR (Lado inferior: 380 -> 190)
                        instructionText.textContent = "Exhala";
                        targetOffset = 380 - (phaseProgress * 190);
                    } else if (phaseIndex === 3) {
                        // Fase 4: VACÍO (Lado izquierdo: 190 -> 0)
                        instructionText.textContent = "Vacío";
                        targetOffset = 190 - (phaseProgress * 190);
                    }

                    boxProgress.style.transition = 'none';
                    boxProgress.style.strokeDashoffset = targetOffset;
                }

                if (!cycleAudio.paused && !cycleAudio.ended && isRunning) {
                    animationFrameId = requestAnimationFrame(syncWithAudio);
                }
            }

            cycleAudio.onplay = () => {
                animationFrameId = requestAnimationFrame(syncWithAudio);
            };

            // Asegurar ejecución si los metadatos tardan en estar listos
            cycleAudio.onloadedmetadata = () => {
                if (!animationFrameId && !cycleAudio.paused) {
                    animationFrameId = requestAnimationFrame(syncWithAudio);
                }
            };

            cycleAudio.onended = () => {
                if (isRunning) {
                    runCycleSequence(cycleNum + 1);
                }
            };
        }
    </script>
</body>
</html>
