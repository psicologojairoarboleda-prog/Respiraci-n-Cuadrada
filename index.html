<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Respiración Guiada - Calm</title>
    <style>
        :root {
            --bg-color: #f4f0ea;
            --card-bg: #ffffff;
            --primary-color: #8b7bb0;
            --text-color: #2c2c2c;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 24px;
            padding: 30px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
            color: var(--primary-color);
        }

        p.subtitle {
            font-size: 0.95rem;
            color: #666;
            margin-top: 0;
            margin-bottom: 30px;
        }

        .circle-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 220px;
            margin: 20px 0;
        }

        .breathing-circle {
            width: 110px;
            height: 110px;
            background-color: var(--primary-color);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            font-size: 2.2rem;
            box-shadow: 0 0 20px rgba(139, 123, 176, 0.3);
            transform: scale(1);
            transition: transform 1s linear, background-color 0.5s ease;
        }

        .instruction {
            font-size: 1.2rem;
            font-weight: 600;
            min-height: 45px;
            margin: 15px 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .timer-info {
            font-size: 0.9rem;
            color: #777;
            margin-bottom: 25px;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s ease;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>RESPIRACIÓN CUADRADA</h1>
        <p class="subtitle">Respira para calmar tu cuerpo y mente</p>

        <div class="circle-container">
            <div class="breathing-circle" id="circle">--</div>
        </div>

        <div class="instruction" id="instructionText">Haz clic en Iniciar</div>
        <div class="timer-info" id="cycleText">Ciclo: 0 / 4</div>

        <button class="btn" id="startBtn" onclick="toggleExercise()">Iniciar Respiración</button>
    </div>

    <script>
        // Mapeo de archivos de audio
        const bgMusic = new Audio('audio1.mp3'); // Música de fondo (Audio Nueve)
        bgMusic.loop = true;
        bgMusic.volume = 0.3; // Volumen moderado para no tapar la voz

        const voiceAudios = {
            intro: new Audio('audio9.mp3'),         // Introducción a la técnica
            technique: new Audio('audio8.mp3'),     // Explicación de las 4 fases
            prep: new Audio('audio7.mp3'),          // Preparación/Exhalación inicial
            cycle1: new Audio('audio6.mp3'),        // Ciclo 1
            cycle2: new Audio('audio5.mp3'),        // Ciclo 2
            cycle3: new Audio('audio4.mp3'),        // Ciclo 3
            cycle4: new Audio('audio3.mp3'),        // Ciclo 4
            outro: new Audio('audio2.mp3')          // Cierre y retorno
        };

        let isRunning = false;
        let countdownInterval;
        let currentVoiceAudio = null;

        const circle = document.getElementById('circle');
        const instructionText = document.getElementById('instructionText');
        const cycleText = document.getElementById('cycleText');
        const startBtn = document.getElementById('startBtn');

        const MIN_SCALE = 1.0;
        const MAX_SCALE = 1.8;

        function toggleExercise() {
            if (isRunning) {
                stopExercise();
            } else {
                startExercise();
            }
        }

        function playVoiceSequence(audioObj, text, onEndedCallback) {
            if (!isRunning) return;
            
            instructionText.textContent = text;
            currentVoiceAudio = audioObj;
            currentVoiceAudio.currentTime = 0;
            
            currentVoiceAudio.play().catch(err => console.error("Error al reproducir audio de voz:", err));
            
            currentVoiceAudio.onended = () => {
                if (isRunning && onEndedCallback) {
                    onEndedCallback();
                }
            };
        }

        function startExercise() {
            isRunning = true;
            startBtn.textContent = 'Detener';
            startBtn.style.backgroundColor = '#d9534f';

            // 1. Iniciar música de fondo desde el segundo 10
            bgMusic.currentTime = 10;
            bgMusic.play().catch(err => console.error("Error al reproducir música de fondo:", err));

            // 2. Secuencia de audios introductorios antes de los ciclos
            playVoiceSequence(voiceAudios.intro, "Escucha la introducción...", () => {
                playVoiceSequence(voiceAudios.technique, "Explicación de la técnica...", () => {
                    playVoiceSequence(voiceAudios.prep, "Prepárate...", () => {
                        runCycleSequence(1);
                    });
                });
            });
        }

        function stopExercise() {
            isRunning = false;
            
            // Pausar y reiniciar música de fondo
            bgMusic.pause();
            bgMusic.currentTime = 10;

            // Pausar audio de voz actual
            if (currentVoiceAudio) {
                currentVoiceAudio.pause();
                currentVoiceAudio.currentTime = 0;
            }

            clearInterval(countdownInterval);

            // Restablecer interfaz de usuario
            circle.style.transform = `scale(${MIN_SCALE})`;
            circle.style.backgroundColor = 'var(--primary-color)';
            circle.textContent = '--';
            instructionText.textContent = 'Haz clic en Iniciar';
            cycleText.textContent = 'Ciclo: 0 / 4';
            startBtn.textContent = 'Iniciar Respiración';
            startBtn.style.backgroundColor = 'var(--primary-color)';
        }

        function runCycleSequence(cycleNum) {
            if (!isRunning) return;

            if (cycleNum > 4) {
                // Secuencia finalizada: Audio de cierre
                cycleText.textContent = `Ciclo: 4 / 4`;
                playVoiceSequence(voiceAudios.outro, "Finalizando...", () => {
                    instructionText.textContent = '¡Excelente trabajo! Te has relajado.';
                    stopExercise();
                });
                return;
            }

            cycleText.textContent = `Ciclo: ${cycleNum} / 4`;
            const cycleAudio = voiceAudios[`cycle${cycleNum}`];

            // Reproduce la guía de voz del ciclo y sincroniza el temporizador visual (4s por fase)
            playVoiceSequence(cycleAudio, `Ciclo ${cycleNum} en curso...`, () => {
                runCycleSequence(cycleNum + 1);
            });

            // Animación sincronizada con la voz (Inhala, Sostén, Exhala, Pausa)
            runVisualPhase('inhale', 4, '#9d8ec2', () => {
                runVisualPhase('hold', 4, '#8b7bb0', () => {
                    runVisualPhase('exhale', 4, '#bdae8b', () => {
                        runVisualPhase('pause', 4, '#779ecb', () => {});
                    });
                });
            });
        }

        function runVisualPhase(phaseType, totalSeconds, color, onComplete) {
            if (!isRunning) return;

            circle.style.backgroundColor = color;
            let remainingSeconds = totalSeconds;

            const updateVisuals = (currentSecond) => {
                let elapsed = totalSeconds - currentSecond;
                let scale = MIN_SCALE;

                if (phaseType === 'inhale') {
                    scale = MIN_SCALE + ((MAX_SCALE - MIN_SCALE) * (elapsed / totalSeconds));
                } else if (phaseType === 'hold') {
                    scale = MAX_SCALE;
                } else if (phaseType === 'exhale') {
                    scale = MAX_SCALE - ((MAX_SCALE - MIN_SCALE) * (elapsed / totalSeconds));
                } else if (phaseType === 'pause') {
                    scale = MIN_SCALE;
                }

                circle.style.transform = `scale(${scale})`;
                circle.textContent = currentSecond;
            };

            updateVisuals(remainingSeconds);

            clearInterval(countdownInterval);
            countdownInterval = setInterval(() => {
                if (!isRunning) {
                    clearInterval(countdownInterval);
                    return;
                }
                remainingSeconds--;
                if (remainingSeconds >= 0) {
                    updateVisuals(remainingSeconds);
                }
                if (remainingSeconds <= 0) {
                    clearInterval(countdownInterval);
                    if (onComplete) onComplete();
                }
            }, 1000);
        }
    </script>
</body>
</html>
