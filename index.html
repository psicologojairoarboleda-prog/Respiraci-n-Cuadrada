<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Respiración Cuadrática - Meditación Guiada</title>
    <style>
        :root {
            --bg-color: #f4f0ea;
            --card-bg: #ffffff;
            --primary-color: #8b7bb0;
            --accent-inhale: #71b280;
            --accent-hold1: #8b7bb0;
            --accent-exhale: #e08a68;
            --accent-hold2: #5c9ead;
            --text-color: #2c2c2c;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 24px;
            padding: 30px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
            color: var(--primary-color);
        }

        p.subtitle {
            font-size: 0.9rem;
            color: #666;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .box-wrapper {
            position: relative;
            width: 220px;
            height: 220px;
            margin: 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .box-bg {
            fill: none;
            stroke: #e6e0d8;
            stroke-width: 8;
        }

        .box-progress {
            fill: none;
            stroke: var(--primary-color);
            stroke-width: 8;
            stroke-linecap: round;
            stroke-dasharray: 800;
            stroke-dashoffset: 800;
            transition: stroke 0.3s ease;
        }

        .breathing-circle {
            width: 100px;
            height: 100px;
            background-color: var(--primary-color);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            font-size: 2.2rem;
            box-shadow: 0 0 20px rgba(0,0,0,0.08);
            transform: scale(1);
            transition: transform 0.1s linear, background-color 0.4s ease;
            z-index: 2;
        }

        .instruction {
            font-size: 1.1rem;
            font-weight: 600;
            min-height: 40px;
            margin: 15px 0 5px 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .timer-info {
            font-size: 0.9rem;
            color: #777;
            margin-bottom: 20px;
        }

        .controls {
            display: flex;
            gap: 10px;
            flex-direction: column;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s ease;
        }

        .audio-toggle {
            background: none;
            border: 1px solid #ccc;
            color: #555;
            padding: 8px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>RESPIRACIÓN CUADRÁTICA</h1>
        <p class="subtitle">Encuentra tu centro y calma tu mente</p>

        <div class="box-wrapper">
            <svg class="box-svg" viewBox="0 0 220 220">
                <rect class="box-bg" x="10" y="10" width="200" height="200" rx="8" />
                <rect class="box-progress" id="boxProgress" x="10" y="10" width="200" height="200" rx="8" />
            </svg>
            <div class="breathing-circle" id="circle">--</div>
        </div>

        <div class="instruction" id="instructionText">Haz clic en Iniciar</div>
        <div class="timer-info" id="cycleText">Ciclo: 0 / 4</div>

        <div class="controls">
            <button class="btn" id="startBtn" onclick="toggleExercise()">Iniciar Respiración</button>
            <button class="audio-toggle" id="audioBtn" onclick="toggleAudio()">🔊 Sonido: Activado</button>
        </div>
    </div>

    <!-- Audios Locutados (del 1 al 8) -->
    <audio id="audio1" src="Audios/Audio1.mp3" preload="auto"></audio>
    <audio id="audio2" src="Audios/Audio2.mp3" preload="auto"></audio>
    <audio id="audio3" src="Audios/Audio3.mp3" preload="auto"></audio>
    <audio id="audio4" src="Audios/Audio4.mp3" preload="auto"></audio>
    <audio id="audio5" src="Audios/Audio5.mp3" preload="auto"></audio>
    <audio id="audio6" src="Audios/Audio6.mp3" preload="auto"></audio>
    <audio id="audio7" src="Audios/Audio7.mp3" preload="auto"></audio>
    <audio id="audio8" src="Audios/Audio8.mp3" preload="auto"></audio>

    <!-- Música de fondo suave y relajante en bucle -->
    <audio id="bgAudio" src="Audios/ambiente.mp3" preload="auto" loop></audio>

    <script>
        let isRunning = false;
        let currentCycle = 0;
        const maxCycles = 4;
        
        let animationInterval = null;
        let audioEnabled = true;

        const circle = document.getElementById('circle');
        const instructionText = document.getElementById('instructionText');
        const cycleText = document.getElementById('cycleText');
        const startBtn = document.getElementById('startBtn');
        const boxProgress = document.getElementById('boxProgress');
        const audioBtn = document.getElementById('audioBtn');
        const bgAudio = document.getElementById('bgAudio');

        // Volumen de la música ambiental muy bajo para que no opaque la voz (10%)
        bgAudio.volume = 0.1;

        const audios = {
            1: document.getElementById('audio1'),
            2: document.getElementById('audio2'),
            3: document.getElementById('audio3'),
            4: document.getElementById('audio4'),
            5: document.getElementById('audio5'),
            6: document.getElementById('audio6'),
            7: document.getElementById('audio7'),
            8: document.getElementById('audio8')
        };

        const TOTAL_PERIMETER = 800;

        function playAudioDynamic(audioElem) {
            return new Promise((resolve) => {
                if (!audioEnabled || !audioElem) {
                    resolve();
                    return;
                }
                audioElem.currentTime = 0;
                audioElem.muted = !audioEnabled;
                audioElem.play().then(() => {
                    audioElem.onended = () => resolve();
                }).catch(err => {
                    console.log("Audio play blocked:", err);
                    resolve();
                });
            });
        }

        function stopAllAudios() {
            Object.values(audios).forEach(a => {
                if (a) {
                    a.pause();
                    a.currentTime = 0;
                }
            });
            bgAudio.pause();
            bgAudio.currentTime = 0;
        }

        function toggleAudio() {
            audioEnabled = !audioEnabled;
            audioBtn.textContent = audioEnabled ? "🔊 Sonido: Activado" : "🔇 Sonido: Silenciado";
            Object.values(audios).forEach(a => { if (a) a.muted = !audioEnabled; });
            bgAudio.muted = !audioEnabled;
        }

        async function toggleExercise() {
            if (isRunning) {
                stopExercise();
            } else {
                startExercise();
            }
        }

        async function startExercise() {
            if (isRunning) return;
            isRunning = true;
            currentCycle = 0;
            startBtn.textContent = 'Detener';
            startBtn.style.backgroundColor = '#d9534f';

            if (audioEnabled) {
                bgAudio.currentTime = 0;
                bgAudio.play().catch(e => console.log(e));
            }

            // 1. Introducción y Postura (Audios 1, 2 y 3 en secuencia natural)
            instructionText.textContent = "Preparación...";
            await playAudioDynamic(audios[1]);
            if (!isRunning) return;

            await playAudioDynamic(audios[2]);
            if (!isRunning) return;

            instructionText.textContent = "Toma aire profundo...";
            await playAudioDynamic(audios[3]);
            if (!isRunning) return;

            // 2. Iniciar Ciclos guiados por la duración real de tus audios de fases
            runNextCycle();
        }

        function stopExercise() {
            isRunning = false;
            clearInterval(animationInterval);
            stopAllAudios();

            circle.style.transform = 'scale(1)';
            circle.style.backgroundColor = 'var(--primary-color)';
            circle.textContent = '--';
            instructionText.textContent = 'Haz clic en Iniciar';
            cycleText.textContent = 'Ciclo: 0 / 4';
            boxProgress.style.strokeDashoffset = TOTAL_PERIMETER;
            startBtn.textContent = 'Iniciar Respiración';
            startBtn.style.backgroundColor = 'var(--primary-color)';
        }

        async function runNextCycle() {
            if (!isRunning) return;

            currentCycle++;
            if (currentCycle > maxCycles) {
                finishSession();
                return;
            }

            cycleText.textContent = `Ciclo: ${currentCycle} / ${maxCycles}`;

            // Seleccionar el audio correspondiente al ciclo actual (Audio 4, 5, 6 o 7)
            let cycleAudio = audios[currentCycle + 3];

            if (audioEnabled && cycleAudio) {
                // Sincronizamos la animación exactamente a la duración del archivo de audio real
                let durationMs = (cycleAudio.duration && !isNaN(cycleAudio.duration)) ? cycleAudio.duration * 1000 : 16000;
                
                cycleAudio.currentTime = 0;
                cycleAudio.muted = !audioEnabled;
                cycleAudio.play().catch(e => console.log(e));

                await runSyncedPhases(durationMs);
            } else {
                // Si el sonido está desactivado, usamos un respaldo de 16 segundos (4s por cada una de las 4 fases)
                await runSyncedPhases(16000);
            }

            if (isRunning) {
                runNextCycle();
            }
        }

        function runSyncedPhases(totalAudioDurationMs) {
            return new Promise((resolve) => {
                let startTime = Date.now();
                // Cada una de las 4 fases ocupa exactamente el 25% del tiempo total del audio de ese ciclo
                let phaseTimeMs = totalAudioDurationMs / 4; 

                clearInterval(animationInterval);

                animationInterval = setInterval(() => {
                    if (!isRunning) {
                        clearInterval(animationInterval);
                        resolve();
                        return;
                    }

                    let elapsed = Date.now() - startTime;
                    let globalProgress = Math.min(elapsed / totalAudioDurationMs, 1);

                    // Determinar en qué fase nos encontramos (0: Inhala, 1: Sostén, 2: Exhala, 3: Vacío)
                    let currentPhaseIndex = Math.floor(elapsed / phaseTimeMs);
                    if (currentPhaseIndex > 3) currentPhaseIndex = 3;

                    let phaseElapsed = elapsed - (currentPhaseIndex * phaseTimeMs);
                    let phaseProgress = Math.min(phaseElapsed / phaseTimeMs, 1);
                    let currentSecond = Math.min(Math.floor(phaseElapsed / 1000) + 1, 4);

                    circle.textContent = currentSecond;

                    // Actualizar textos e interpolar trazo del cuadrado de forma fluida adaptada a tu voz
                    let startOffset = TOTAL_PERIMETER - (currentPhaseIndex * 200);
                    let targetOffset = startOffset - (200 * phaseProgress);
                    boxProgress.style.strokeDashoffset = targetOffset;

                    if (currentPhaseIndex === 0) {
                        instructionText.textContent = "1. INHALA por la nariz";
                        boxProgress.style.stroke = "var(--accent-inhale)";
                        circle.style.backgroundColor = "var(--accent-inhale)";
                        circle.style.transform = `scale(${1 + (0.5 * phaseProgress)})`;
                    } else if (currentPhaseIndex === 1) {
                        instructionText.textContent = "2. SOSTÉN EL AIRE";
                        boxProgress.style.stroke = "var(--accent-hold1)";
                        circle.style.backgroundColor = "var(--accent-hold1)";
                        circle.style.transform = "scale(1.5)";
                    } else if (currentPhaseIndex === 2) {
                        instructionText.textContent = "3. EXHALA despacio";
                        boxProgress.style.stroke = "var(--accent-exhale)";
                        circle.style.backgroundColor = "var(--accent-exhale)";
                        circle.style.transform = `scale(${1.5 - (0.5 * phaseProgress)})`;
                    } else if (currentPhaseIndex === 3) {
                        instructionText.textContent = "4. SOSTÉN EN VACÍO";
                        boxProgress.style.stroke = "var(--accent-hold2)";
                        circle.style.backgroundColor = "var(--accent-hold2)";
                        circle.style.transform = "scale(1)";
                    }

                    if (elapsed >= totalAudioDurationMs) {
                        clearInterval(animationInterval);
                        resolve();
                    }
                }, 20);
            });
        }

        async function finishSession() {
            instructionText.textContent = 'Regresando a tu ritmo natural...';
            cycleText.textContent = 'Completado';
            
            // Reproducir Audio 8 de cierre
            await playAudioDynamic(audios[8]);
            
            instructionText.textContent = '¡Excelente trabajo!';
            stopExercise();
        }
    </script>
</body>
</html>
